<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>捏盘寿司吃吃🍣 for Jenny</title>
<style>
:root{
  --wood:#e0b87a;--wood-dark:#b07a38;--wood-light:#f8e7c8;
  --mat:#3d6cb0;--mat-dark:#2a4e88;--cream:#fff8ef;--ink:#4a3224;
  --accent:#ff6b57;--rice:#fffaf2;--nori:#1a3a28;
  --success:#3db87a;--warn:#f0b429;--bad:#ff8a6a;
  --blush:#ffd6de;--sky:#7ec8f0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:linear-gradient(160deg,#3b2618 0%,#6a4530 40%,#4a3224 100%);color:var(--ink);touch-action:none;user-select:none}
#app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;background:linear-gradient(180deg,#fff4e8 0%,#f7e4cc 55%,#efd2b0 100%);box-shadow:0 0 40px rgba(0,0,0,.4)}
.screen{display:none;flex:1;flex-direction:column;min-height:0;position:relative}
.screen.active{display:flex}
#screen-start{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 28%,rgba(255,255,255,.55),transparent 62%),linear-gradient(180deg,#fff6ec 0%,#f3d9be 100%);text-align:center;padding:20px 24px 8px;gap:10px}
.logo-row{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:86px}
.logo-cat{font-size:48px;line-height:1;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12));transform-origin:bottom center}
.logo-sushi{font-size:72px;line-height:1;animation:bob 2.4s ease-in-out .2s infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.15))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title-main{font-size:28px;font-weight:800;letter-spacing:.06em}
.title-for{display:inline-block;background:linear-gradient(180deg,#ffd0e0,#ffb6c8);color:#8a3050;font-size:13px;font-weight:800;padding:4px 14px;border-radius:999px;letter-spacing:.04em;box-shadow:0 2px 0 rgba(180,80,110,.2)}
.title-sub{font-size:13px;color:#8a6a52;margin-bottom:6px}
.btn{border:none;border-radius:999px;padding:16px 36px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;min-height:52px;transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s,background .15s,filter .15s;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn-primary{background:linear-gradient(180deg,#ff8a72,#ff5e4a);color:#fff;min-width:200px}
.btn-primary:hover{filter:brightness(1.05)}
.btn-secondary{background:linear-gradient(180deg,#fff8f0,#f3e2cc);color:var(--ink);border:2px solid #e0b87a}
.btn-ghost{background:transparent;color:#8a6a52;box-shadow:none;font-size:14px;padding:8px 16px;min-height:40px}
.btn-wet{background:linear-gradient(180deg,#7ec8f0,#4aa8e0);color:#fff;min-width:180px;font-size:20px;min-height:56px;padding:18px 40px}
.btn-wet.active{background:linear-gradient(180deg,#5eca8e,#3da86c)}
.btn-action{background:linear-gradient(180deg,#ffd56a,#f0b429);color:#5a3a10;min-width:170px}
.btn-lg{font-size:20px;min-height:56px;padding:18px 40px;min-width:200px}
.collected-hint{font-size:12px;color:#9a8068;margin-top:8px}
.start-mute{margin-top:2px}
.hud{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-bottom:1px solid rgba(176,122,56,.15);flex-shrink:0;z-index:20;gap:8px}
.hud-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.hud-piece{font-size:12px;font-weight:700;color:var(--accent)}
.hud-topping{font-size:16px;font-weight:800}
.hud-step{font-size:12px;color:#7a6550;background:rgba(255,255,255,.85);padding:5px 12px;border-radius:999px;flex-shrink:0}
.hud-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hud-mute{width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,.9);font-size:20px;cursor:pointer;font-family:inherit;box-shadow:0 2px 0 rgba(0,0,0,.08);line-height:1}
.hud-mute:active{transform:translateY(1px)}
.hud-done{font-size:13px;font-weight:700;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:10px 14px;cursor:pointer;font-family:inherit;min-height:44px}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.helper-row{display:flex;align-items:center;gap:8px;padding:6px 12px 2px;flex-shrink:0}
.helper-icon{font-size:28px;line-height:1;flex-shrink:0;animation:mascotBob 2s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.helper-icon.point{animation:mascotPoint .7s ease-in-out infinite}
.helper-icon.celebrate{animation:mascotCelebrate .55s ease-out}
@keyframes mascotBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
@keyframes mascotPoint{0%,100%{transform:translateY(0) rotate(-12deg) scale(1)}50%{transform:translateY(-3px) rotate(10deg) scale(1.08)}}
@keyframes mascotCelebrate{0%{transform:scale(1) rotate(0) translateY(0)}30%{transform:scale(1.25) rotate(-12deg) translateY(-8px)}60%{transform:scale(1.15) rotate(12deg) translateY(-4px)}100%{transform:scale(1) rotate(0) translateY(0)}}
.helper-bubble{flex:1;background:#fff;border-radius:16px 16px 16px 6px;padding:8px 12px;font-size:14px;font-weight:700;color:#4a3224;box-shadow:0 2px 0 rgba(176,122,56,.12);line-height:1.35;min-height:36px;display:flex;align-items:center}
.stage-tip{text-align:center;padding:0 16px 4px;font-size:11px;color:#9a7d62;flex-shrink:0;line-height:1.35;min-height:1.35em}
.stage-canvas-wrap{flex:1;min-height:0;position:relative;margin:0 12px 6px;border-radius:20px;overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.1)}
canvas#game{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#game.grabbing{cursor:grabbing}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:8px 12px 10px;flex-shrink:0}
.float-fb{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:22px;font-weight:800;pointer-events:none;z-index:50;text-shadow:0 2px 10px rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.12);animation:floatUp 1.35s cubic-bezier(.2,.7,.2,1) forwards;white-space:nowrap}
.float-fb.good{color:var(--success)}.float-fb.ok{color:#e09030}.float-fb.bad{color:#e07050}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.72);filter:blur(2px)}12%{opacity:1;transform:translate(-50%,-48%) scale(1.12);filter:blur(0)}30%{transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-105%) scale(.96)}}
#screen-pick{background:linear-gradient(180deg,#fff6ec,#f3e0ca)}
.pick-header{padding:16px 16px 8px;text-align:center}
.pick-header h2{font-size:20px;margin-bottom:4px}
.pick-header p{font-size:12px;color:#8a6a52}
.topping-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px 16px;overflow-y:auto;flex:1}
.topping-card{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:0 3px 0 rgba(176,122,56,.12);transition:transform .12s,border-color .12s,box-shadow .12s}
.topping-card:active{transform:scale(.96)}
.topping-card:hover{border-color:#f0b429;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.topping-card .emoji{font-size:38px;line-height:1.2}
.topping-card .name{font-size:13px;font-weight:700;margin-top:4px}
.topping-card .tag{font-size:10px;color:#fff;background:#3db87a;border-radius:999px;padding:2px 8px;margin-top:4px;display:inline-block}
.board-bar{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;flex-shrink:0;background:rgba(176,122,56,.12)}
.board-piece{flex-shrink:0;width:52px;height:40px;border-radius:10px;background:linear-gradient(180deg,#f0d0a0,#d4a86a);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 4px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.06)}
.board-piece.empty{opacity:.4;font-size:14px;color:#b07a38}
#screen-result{align-items:center;justify-content:flex-start;padding:20px 20px 12px;overflow-y:auto;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 50%),linear-gradient(180deg,#fff6ec,#f3d9be);text-align:center;gap:8px}
.score-big{font-size:64px;font-weight:900;color:var(--accent);line-height:1}
.score-label{font-size:14px;color:#8a6a52}
.result-cheer{font-size:15px;font-weight:700;color:#3db87a}
.quirk-title{font-size:20px;font-weight:800;color:var(--ink);background:rgba(255,255,255,.75);padding:12px 20px;border-radius:16px;margin:4px 0;max-width:100%}
.score-breakdown{width:100%;text-align:left;background:rgba(255,255,255,.65);border-radius:14px;padding:12px 16px;font-size:13px}
.score-breakdown .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.score-breakdown .row:last-child{border-bottom:none}
.sticker-wall{width:100%;background:rgba(255,255,255,.65);border-radius:14px;padding:12px 12px 14px;text-align:center}
.sticker-wall h3{font-size:14px;margin-bottom:8px}
.sticker-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sticker-chip{background:linear-gradient(180deg,#fff,#fff3e0);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 0 rgba(176,122,56,.15);border:1px solid #f0d0a0}
.sticker-chip.alltime{opacity:.85;font-weight:600;font-size:12px;background:#fff}
.sticker-empty{font-size:12px;color:#9a8068}
.titles-collected{width:100%;text-align:left;font-size:12px;color:#6a5540}
.titles-collected .chip{display:inline-block;background:#fff;border-radius:999px;padding:4px 10px;margin:3px;border:1px solid #e0b87a}
.titles-collected .chip.new{background:#fff3cd;border-color:var(--warn);font-weight:700}
.toast{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);background:rgba(61,43,31,.9);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.game-footer{flex-shrink:0;text-align:center;font-size:11px;color:#a08068;padding:6px 12px 8px;letter-spacing:.02em;line-height:1.3;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,244,232,.65))}
.sticker-pop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:80;pointer-events:none;background:rgba(255,248,240,.35)}
.sticker-pop.show{display:flex}
.sticker-pop .card{background:#fff;border-radius:22px;padding:16px 22px;font-size:20px;font-weight:800;box-shadow:0 10px 32px rgba(0,0,0,.16);animation:stickerIn .5s cubic-bezier(.2,1.2,.3,1)}

.diy-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;margin:0 0 4px}
.btn-diy{min-height:40px;padding:8px 14px;font-size:13px;min-width:auto;box-shadow:0 2px 0 rgba(0,0,0,.1);background:linear-gradient(180deg,#fff8f0,#f3e2cc);color:var(--ink);border:2px solid #e0b87a}
.btn-diy.on{background:linear-gradient(180deg,#ffe08a,#f0b429);border-color:#e0a020;font-weight:800}
.sticker-pop .sub{font-size:13px;font-weight:700;color:#8a6a52;background:rgba(255,255,255,.9);padding:4px 12px;border-radius:999px}
@keyframes stickerIn{0%{transform:scale(.4) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}
</style>
</head>
<body>
<div id="app">
  <div id="screen-start" class="screen active">
    <div class="logo-row"><span class="logo-cat">🐱</span><span class="logo-sushi">🍣</span></div>
    <div class="title-main">捏盘寿司吃吃</div>
    <div class="title-for">for Jenny</div>
    <div class="title-sub">一起来捏寿司吧，轻轻切、慢慢捏～</div>
    <button class="btn btn-primary btn-lg" id="btn-start">开始</button>
    <button class="btn btn-ghost" id="btn-howto">怎么玩？</button>
    <button class="btn btn-ghost start-mute" id="btn-mute-start">🔊 声音开</button>
    <div class="collected-hint" id="collected-count">已收集称号 0 / ?</div>
  </div>
  <div id="screen-pick" class="screen">
    <div class="pick-header">
      <h2>选一个喜欢的食材吧</h2>
      <p>有「军舰」标记的会包海苔 · 捏满 3 贯可以收工</p>
    </div>
    <div class="topping-grid" id="topping-grid"></div>
  </div>
  <div id="screen-play" class="screen">
    <div class="hud">
      <div class="hud-left">
        <span class="hud-piece" id="hud-piece">第 1 贯</span>
        <span class="hud-topping" id="hud-topping">金枪鱼</span>
      </div>
      <span class="hud-step" id="hud-step">切鱼</span>
      <div class="hud-right">
        <button class="hud-mute" id="btn-mute" type="button" aria-label="开关声音">🔊</button>
        <button class="hud-done" id="btn-finish-early">收工评分</button>
      </div>
    </div>
    <div class="board-bar" id="board-bar"></div>
    <div class="stage">
      <div class="helper-row">
        <div class="helper-icon" id="mascot">🐱</div>
        <div class="helper-bubble" id="helper-speech">向下滑，看刀把鱼切开～</div>
      </div>
      <div class="stage-tip" id="stage-tip"></div>
      <div class="stage-canvas-wrap">
        <canvas id="game"></canvas>
      </div>
      <div class="controls" id="controls"></div>
    </div>
  </div>
  <div id="screen-result" class="screen">
    <div class="score-label">本盘综合评分</div>
    <div class="score-big" id="score-big">0</div>
    <div class="result-cheer" id="result-cheer">太棒了！</div>
    <div class="quirk-title" id="quirk-title">没有特别的怪癖放到最满</div>
    <div class="sticker-wall" id="sticker-wall"></div>
    <div class="score-breakdown" id="score-breakdown"></div>
    <div class="titles-collected" id="titles-box"></div>
    <button class="btn btn-primary btn-lg" id="btn-again" style="margin-top:10px">再捏一盘</button>
    <button class="btn btn-secondary" id="btn-home">回首页</button>
  </div>
  <div class="game-footer" id="game-footer">for Jenny  ·  更新于 2026-11-16 00:04（香港时间）</div>
  <div class="toast" id="toast"></div>
  <div class="sticker-pop" id="sticker-pop"></div>
</div>
<script>
(function () {
  'use strict';

  const FOOTER_TEXT = 'for Jenny  ·  更新于 2026-11-16 00:04（香港时间）';

  const TOPPINGS = [

  let collectedTitles = loadTitles();
  let collectedStickers = loadStickers();
  let sessionStickers = [];

  function loadTitles(){ try{ return JSON.parse(localStorage.getItem('sushi_titles')||'[]'); }catch(e){ return []; } }
  function saveTitle(t){ if(!collectedTitles.includes(t)){ collectedTitles.push(t); localStorage.setItem('sushi_titles', JSON.stringify(collectedTitles)); return true;} return false; }

  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function shade(hex, amt){
    const n=parseInt(hex.slice(1),16);
    let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
    r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function easeInOut(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function unlockAudio(){
    try{
      if(!audio.ctx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC) return null;
        audio.ctx=new AC();
      }
      if(audio.ctx.state==='suspended') audio.ctx.resume();
      return audio.ctx;
    }catch(e){ return null; }
  }
  function ensureAudio(){ if(audio.muted) return null; return unlockAudio(); }
  function tone(freq, dur, type, vol, when, slide){
    const ctx=ensureAudio(); if(!ctx) return;
    const t=ctx.currentTime+(when||0);
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), t+dur);
    g.gain.setValueAtTime(Math.max(0.0001, vol||0.08), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function sfxPop(){ tone(720, 0.09, 'triangle', 0.07); tone(1080, 0.06, 'sine', 0.03, 0.02); }
  function sfxChime(){ tone(880, 0.16, 'sine', 0.07); tone(1320, 0.2, 'sine', 0.055, 0.07); tone(1760, 0.24, 'sine', 0.04, 0.14); }
  function sfxWhoosh(){
    const ctx=ensureAudio(); if(!ctx) return;
    const t=ctx.currentTime;
    try{
      const len=Math.floor(ctx.sampleRate*0.22);
      const buf=ctx.createBuffer(1,len,ctx.sampleRate);
      const data=buf.getChannelData(0);
      for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.4);
      const src=ctx.createBufferSource(); src.buffer=buf;
      const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(2200,t); f.frequency.exponentialRampToValueAtTime(380,t+0.2);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t);
    }catch(e){ tone(900, 0.16, 'sawtooth', 0.04, 0, 280); }
  }
  function sfxDing(){
    tone(523, 0.18, 'sine', 0.07);
    tone(659, 0.2, 'sine', 0.06, 0.08);
    tone(784, 0.28, 'sine', 0.07, 0.16);
    tone(1046, 0.32, 'triangle', 0.04, 0.24);
  }

  function toggleMute(){

  const $=s=>document.querySelector(s);

  function makeGrain(rng, ox, oy, oz){
    return {
      ox, oy, oz: oz||0,
      x:ox, y:oy, z:oz||0,
      tx:ox, ty:oy, tz:oz||0,
      rot:(rng()*Math.PI),
      len:4.6+rng()*1.8,
      wid:2.9+rng()*1.2,
      col:RICE_COLORS[(rng()*RICE_COLORS.length)|0],
      stick: rng()<0.08,
    };
  }

  function buildHangiriBed(){
    const bw=220, bh=120;
    const c=document.createElement('canvas');
    c.width=bw*dpr; c.height=bh*dpr;
    const g=c.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    const rng=mulberry32(42);
    for(let i=0;i<360;i++){
      const u=rng(), v=rng();
      const ang=u*Math.PI*2;
      const rad=Math.sqrt(v)*0.92;
      const x=bw/2+Math.cos(ang)*rad*90;
      const y=bh/2+Math.sin(ang)*rad*40;
      const rot=rng()*Math.PI;
      const len=4.2+rng()*1.8, wid=2.6+rng()*1.1;
      g.save(); g.translate(x,y); g.rotate(rot);
      g.fillStyle=RICE_COLORS[(rng()*RICE_COLORS.length)|0];
      g.beginPath(); g.ellipse(0,0,len/2,wid/2,0,0,Math.PI*2); g.fill();
      g.globalAlpha=0.35; g.fillStyle='#fff';
      g.beginPath(); g.ellipse(-len*0.15,-wid*0.15,len*0.18,wid*0.18,0,0,Math.PI*2); g.fill();
      g.globalAlpha=1; g.restore();
    }
    rice.bedCanvas=c; rice.bedW=bw; rice.bedH=bh;
  }

  function syncMoundGrains(amt){
    const target=Math.floor(40+amt*140);
    rice.targetCount=target;
    const rng=mulberry32(1000+((amt*1000)|0));
    while(rice.mound.length<target){
      const i=rice.mound.length;
      const ang=rng()*Math.PI*2;
      const rad=Math.sqrt(rng())*(12+amt*28);
      const h=rng()*(10+amt*36)*(1-rad/(12+amt*28+1));
      const g=makeGrain(rng, Math.cos(ang)*rad*0.85, -h, Math.sin(ang)*rad*0.35);
      g.x=g.ox-30-rng()*40; g.y=g.oy+20; g.fly=1;
      rice.mound.push(g);
      if(state.stickyPenalty && rng()<0.12){
        fx.flyingGrains.push({x:W*0.5+g.x, y:H*0.42+g.y, vx:(rng()-0.5)*2, vy:-1-rng(), life:1, col:g.col, len:g.len, wid:g.wid, rot:g.rot});
      }
    }
    if(rice.mound.length>target) rice.mound.length=target;
  }

  function buildPileFromRice(){
    const amt=state.riceAmount||0.4;
    const n=Math.floor(70+amt*160);
    rice.pileSeed=(state.pieceIndex+1)*997+(state.topping?state.topping.id.length:0)*13+((amt*100)|0);
    const rng=mulberry32(rice.pileSeed);
    rice.pile=[];
    rice.morph=0; rice.morphTarget=0;
    for(let i=0;i<n;i++){
      const ang=rng()*Math.PI*2;
      const rad=Math.sqrt(rng());
      const rx=28+amt*18, ry=18+amt*10;
      const ox=Math.cos(ang)*rad*rx;
      const oz=Math.sin(ang)*rad*ry*0.55;
      const h=(1-rad)*(22+amt*16)*(0.7+rng()*0.6);
      const g=makeGrain(rng, ox, -h, oz);
      g.baseOx=ox; g.baseOy=-h; g.baseOz=oz; g.rad=rad; g.ang=ang;
      rice.pile.push(g);
    }
  }

  function shariMorphTarget(){
    const taps=state.shapeTaps||0;
    if(taps<=0) return 0.58;
    if(taps<3) return 0.42;
    if(taps<=6) return 0.58;
    return Math.min(1.22, 0.85+(taps-6)*0.12);
  }
  function snapPileToMorph(m){
    applyMorphToPile(m);
    rice.morph=m; rice.morphTarget=m;
    for(const g of rice.pile){ g.x=g.tx; g.y=g.ty; g.z=g.tz; }
  }

  function applyMorphToPile(morph){
    const m=clamp(morph,0,1.35);
    rice.morph=m;
    for(const g of rice.pile){
      const rad=g.rad, ang=g.ang;
      let rx, ry, hMul, flatten, pinch;
      if(m<0.5){
        const t=m/0.5;
        rx=lerp(28, 50, t);
        ry=lerp(22, 13, t);
        hMul=lerp(1.0, 0.56, t);
        flatten=lerp(0, 0.2, t);
        pinch=lerp(0, 0.28, t);
      } else {
        const t=(m-0.5)/0.5;
        rx=lerp(50, 56, t);
        ry=lerp(13, 18.5, t);
        hMul=lerp(0.56, 0.24, t);
        flatten=lerp(0.2, 0.72, t);
        pinch=lerp(0.28, 0.08, t);
      }
      const waist=1-pinch*(1-Math.abs(Math.cos(ang)));
      const ox=Math.cos(ang)*rad*rx*(1-flatten*0.08);
      const oz=Math.sin(ang)*rad*ry*waist;
      const loft=1-Math.pow(rad,2.8);
      const h=Math.max(2.0, loft*22*hMul*(0.8+((g.len%1)*0.35)));
      g.tx=ox; g.tz=oz; g.ty=-h;
      if(m>1){
        const e=m-1;
        g.tx*=1+e*0.38; g.tz*=1+e*0.28; g.ty*=Math.max(0.15,1-e*1.1);
      }
    }
  }

  function stepPileSprings(dt){
    const k=Math.min(1, dt*10);
    for(const g of rice.pile){
      g.x=lerp(g.x,g.tx,k); g.y=lerp(g.y,g.ty,k); g.z=lerp(g.z,g.tz,k);
    }
    rice.morph=lerp(rice.morph, rice.morphTarget, Math.min(1,dt*6));
  }

  function drawGrainAt(g, cx, cy, scale, shadow){
    const sx=cx+g.x*scale, sy=cy+(g.y+g.z*0.35)*scale;
    ctx.fillStyle='rgba(40,30,20,0.16)';
    ctx.beginPath(); ctx.ellipse(sx+1.2, sy+2.4*scale, g.len*0.48*scale, g.wid*0.32*scale, g.rot,0,Math.PI*2); ctx.fill();
    if(shadow){
      ctx.fillStyle='rgba(40,30,20,0.08)';
      ctx.beginPath(); ctx.ellipse(sx+1, cy+8*scale+(g.z*0.1), g.len*0.45*scale, g.wid*0.35*scale, g.rot,0,Math.PI*2); ctx.fill();
    }
    ctx.save();
    ctx.translate(sx,sy); ctx.rotate(g.rot);
    const lw=g.len*scale, ww=g.wid*scale;
    const grd=ctx.createLinearGradient(-lw/2,0,lw/2,0);
    grd.addColorStop(0, shade(g.col,-8));
    grd.addColorStop(0.45, g.col);
    grd.addColorStop(1, shade(g.col,12));
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.ellipse(0,0,lw/2,ww/2,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.4; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(-lw*0.12,-ww*0.18,lw*0.2,ww*0.22,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();
  }

  function drawGrainPile(cx, cy, grains, scale){
    scale=scale||1;
    const firm=clamp(rice.morph,0,1);
    const over=Math.max(0, rice.morph-1);
    const shW=lerp(32, 48, firm)*scale*(1+over*0.28);
    const shH=lerp(16, 10.5, firm)*scale*(1+over*0.12);
    ctx.fillStyle='rgba(30,40,60,0.20)';
    ctx.beginPath();
    ctx.ellipse(cx+1, cy+11*scale, shW, shH, 0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(30,40,60,0.10)';
    ctx.beginPath();
    ctx.ellipse(cx, cy+8*scale, shW*0.72, shH*0.65, 0,0,Math.PI*2);
    ctx.fill();
    const sorted=grains.slice().sort((a,b)=>(a.y+a.z)-(b.y+b.z));
    for(const g of sorted) drawGrainAt(g, cx, cy, scale, false);
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function sashimiPath(w,h,r){
    const arch=h*0.1;
    r=Math.min(r, h*0.4, w*0.2);
    ctx.beginPath();
    ctx.moveTo(-w/2+r, -h/2);
    ctx.quadraticCurveTo(0, -h/2-arch, w/2-r, -h/2);
    ctx.arcTo(w/2, -h/2, w/2, 0, r);
    ctx.quadraticCurveTo(w/2+1, h/2, w/2-r, h/2);
    ctx.quadraticCurveTo(0, h/2+arch*0.4, -w/2+r, h/2);
    ctx.arcTo(-w/2, h/2, -w/2, 0, r);
    ctx.closePath();
  }

  function drawWoodBg(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#f6ead6'); g.addColorStop(1,'#e2c8a4');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(176,122,56,0.08)'; ctx.lineWidth=1.2;
    for(let y=16;y<H;y+=22){
      ctx.beginPath(); ctx.moveTo(0,y);
      for(let x=0;x<W;x+=16) ctx.lineTo(x, y+Math.sin(x*0.04+y*0.02)*2.5);
      ctx.stroke();
    }
  }

  function drawMat(cx,cy,w,h){
    ctx.fillStyle='rgba(30,40,70,0.15)';
    roundRect(cx-w/2+3, cy-h/2+5, w, h, 16); ctx.fill();
    roundRect(cx-w/2, cy-h/2, w, h, 14);
    const g=ctx.createLinearGradient(cx,cy-h/2,cx,cy+h/2);
    g.addColorStop(0,'#4a72bc'); g.addColorStop(1,'#2a4e88');
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1;
    for(let i=-w/2+6;i<w/2;i+=7){ ctx.beginPath(); ctx.moveTo(cx+i,cy-h/2+4); ctx.lineTo(cx+i,cy+h/2-4); ctx.stroke(); }
    for(let j=-h/2+6;j<h/2;j+=7){ ctx.beginPath(); ctx.moveTo(cx-w/2+4,cy+j); ctx.lineTo(cx+w/2-4,cy+j); ctx.stroke(); }
  }

  function drawWaterBowl(cx,cy){
    ctx.fillStyle='rgba(40,40,50,0.12)';
    ctx.beginPath(); ctx.ellipse(cx+2,cy+10,22,8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx,cy,20,12,0,0,Math.PI*2);
    ctx.fillStyle='#f8f8f6'; ctx.fill();
    ctx.strokeStyle='rgba(180,180,175,0.8)'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx,cy-2,14,7,0,0,Math.PI*2);
    const wg=ctx.createRadialGradient(cx-3,cy-4,1,cx,cy,14);
    wg.addColorStop(0,'#d8f2ff'); wg.addColorStop(1,'#6eb0d8');
    ctx.fillStyle=wg; ctx.fill();
    for(const r of fx.waterRipples){
      ctx.strokeStyle=`rgba(255,255,255,${r.life*0.5})`;

    }
    if(state.wetHands){
      ctx.fillStyle='rgba(61,184,122,0.9)';
      ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText('湿', cx, cy+22);
    }
  }

  function drawSashimiFlesh(x,y,w,h,rot,t,opts){
    opts=opts||{};
    const col=t.color, fat=t.fat||'#fff5ee';
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot||0);
    if(opts.scaleX) ctx.scale(opts.scaleX, opts.scaleY||1);
    const bend=opts.bend||0;
    const r=opts.r||Math.min(10,h*0.35);
    ctx.save();
    ctx.translate(2.5, 5);
    sashimiPath(w,h,r);
    ctx.fillStyle='rgba(50,25,18,0.22)';
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(1.2, 2.4);
    sashimiPath(w,h,r);
    ctx.fillStyle=shade(col,-38);
    ctx.fill();
    ctx.restore();
    sashimiPath(w,h,r);
    const g=ctx.createLinearGradient(-w/2,0,w/2,0);
    g.addColorStop(0, shade(col,-22));
    g.addColorStop(0.35, col);
    g.addColorStop(0.7, shade(col,18));
    g.addColorStop(1, shade(col,-8));
    ctx.fillStyle=g; ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.strokeStyle=fat; ctx.globalAlpha=0.6; ctx.lineWidth=1.5; ctx.lineCap='round';
    const lines=opts.lines||6;
    for(let i=0;i<lines;i++){
      const yy=-h/2+6+i*(h-10)/(lines-0.5);
      ctx.beginPath();
      ctx.moveTo(-w/2+4, yy+bend*Math.sin(i));
      ctx.quadraticCurveTo(0, yy-3+i*0.3+bend, w/2-4, yy+2);
      ctx.stroke();
      if(i%2===0){
        ctx.globalAlpha=0.3;
        ctx.beginPath();
        ctx.moveTo(-w/2+10, yy+4);
        ctx.quadraticCurveTo(w*0.1, yy+1, w/2-8, yy+5);
        ctx.stroke();
        ctx.globalAlpha=0.6;
      }
    }
    ctx.globalAlpha=0.22; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(-w*0.1,-h*0.22,w*0.28,h*0.18, -0.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle='rgba(80,40,30,0.18)'; ctx.lineWidth=1;
    sashimiPath(w,h,r); ctx.stroke();
    ctx.globalAlpha=0.28; ctx.strokeStyle='#fff'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(-w/2+6,-h/2+4); ctx.quadraticCurveTo(0,-h/2-2,w/2-10,-h/2+6); ctx.stroke();
    ctx.globalAlpha=1;
    if(opts.cutFace){
      const face=opts.cutFace;
      ctx.globalAlpha=0.9;
      if(face==='right'){
        const cg=ctx.createLinearGradient(w/2-2,-h/2,w/2+6,h/2);

  function drawFishBlock(){
    const cx=W*0.38, cy=H*0.42;
    const fw=130, fh=78;
    const sq=1-fx.fishSquash*0.08;
    const bx=W*0.78, by=H*0.55;

    roundRect(bx-52, by-66, 110, 150, 10); ctx.fill();
    roundRect(bx-58, by-75, 116, 155, 8);
    const bg=ctx.createLinearGradient(bx-40,by-75,bx+50,by+80);
    bg.addColorStop(0,'#f7ebd4'); bg.addColorStop(0.55,'#e4ccaa'); bg.addColorStop(1,'#c9ae86');
    ctx.fillStyle=bg; ctx.fill();
    ctx.strokeStyle='rgba(139,105,20,0.28)'; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(bx-50, by-68); ctx.lineTo(bx+48, by-68); ctx.stroke();
    ctx.strokeStyle='rgba(139,105,20,0.08)'; ctx.lineWidth=1;
    for(let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(bx-50, by-60+i*18); ctx.lineTo(bx+50, by-55+i*18); ctx.stroke(); }

    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('↓ 慢慢下滑选厚度 · 松开切开', cx, cy+fh/2+36);

    const t=state.topping;
    const kind=netaKind(t);
    ctx.save();
    ctx.translate(cx,cy); ctx.scale(1, sq);
    ctx.fillStyle='rgba(50,25,15,0.22)';
    if(kind==='shrimp'){
      ctx.beginPath(); ctx.ellipse(4, fh*0.28, fw*0.42, 12, 0,0,Math.PI*2); ctx.fill();
      drawShrimpNeta(0,0,fw*0.95,fh*0.62,0,{drape:0});
    } else if(kind==='tamago'){
      drawTamagoNeta(0,0,fw*0.95,fh*0.72,0);
    } else if(kind==='scallop'){
      ctx.beginPath(); ctx.ellipse(3, fh*0.22, fh*0.42, 12, 0,0,Math.PI*2); ctx.fill();
      drawScallopNeta(0,0,fh*0.95,fh*0.85,0);
    } else if(kind==='squid'){
      drawSquidNeta(0,0,fw,fh*0.48,0,{drape:0});
    } else {
      roundRect(-fw/2+6, -fh/2+12, fw, fh, 12); ctx.fill();
      drawSashimiFlesh(0,0,fw,fh,0,t,{r:12, lines:7, cutFace: state.sliceCuts.length?'right':null});
    }
    state.sliceCuts.forEach(cut=>{
      const y=-fh/2+(cut.t||0.5)*fh;
      ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.lineWidth=2;
      ctx.beginPath();
      const x0=-fw/2+8, x1=fw/2-8;
      if(cut.jagged){ ctx.moveTo(x0,y); for(let x=x0;x<x1;x+=7) ctx.lineTo(x,y+Math.sin(x*0.8)*2.8); }
      else { ctx.moveTo(x0,y); ctx.lineTo(x1,y); }
      ctx.stroke();
    });
    if(state.dragging && state.step==='slice' && state.dragStart && !fx.slicing){
      const p=state.lastPointer;
      const localY=clamp((state.dragStart.y-cy)/fh+0.5,0.12,0.88);
      const yy=-fh/2+localY*fh;
      ctx.strokeStyle='rgba(220,60,50,0.85)'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(-fw/2+6,yy); ctx.lineTo(fw/2-6,yy); ctx.stroke(); ctx.setLineDash([]);
      const dy=p? (p.y-state.dragStart.y):0;
      let lab='正好！';
      if(dy<30) lab='薄薄的'; else if(dy>200) lab='厚厚的';
      ctx.fillStyle='rgba(220,60,50,0.9)'; ctx.font='bold 13px sans-serif';
      ctx.fillText(lab, 0, yy-10);
    }
    ctx.restore();

    if((state.dragging && state.step==='slice') || fx.slicing){
      const p=state.lastPointer||{x:cx,y:cy};
      let kx=p.x, ky=p.y;
      if(fx.slicing && fx.sliceAnim){
        const u=easeInOut(fx.slicePhase);
        const cut=fx.sliceAnim;
        kx=lerp(cx-fw/2-10, cx+fw/2+20, u);
        ky=cy-fh/2+cut.cutY*fh + Math.sin(u*Math.PI*6)* (cut.jagged?3.5:1.2);
        fx.knifeTrail.push({x:kx,y:ky,life:1});
      } else if(state.lastPointer){
        kx=state.lastPointer.x + Math.sin(performance.now()/40)*1.2;
        ky=state.lastPointer.y;
        fx.knifeTrail.push({x:kx,y:ky,life:1});
      }
      for(let i=0;i<fx.knifeTrail.length;i++){
        const tr=fx.knifeTrail[i];
        ctx.globalAlpha=tr.life*0.35;
        ctx.strokeStyle='#e8eef5'; ctx.lineWidth=2;
        if(i>0){ ctx.beginPath(); ctx.moveTo(fx.knifeTrail[i-1].x,fx.knifeTrail[i-1].y); ctx.lineTo(tr.x,tr.y); ctx.stroke(); }
      }
      ctx.globalAlpha=1;
      drawKnife(kx,ky, fx.slicing?0.15:-0.4);
    }

    if(fx.separated){
      const s=fx.separated;
      const alpha=clamp(s.alpha,0,1);
      ctx.globalAlpha=alpha;
      ctx.fillStyle='rgba(40,30,20,0.28)';
      ctx.beginPath(); ctx.ellipse(s.x+5, s.y+s.h*0.5, s.w*0.48, 9, 0.2,0,Math.PI*2); ctx.fill();
      let sw=s.w, sh=s.h;
      if(s.rating==='thin'){ sh*=0.55; ctx.globalAlpha=alpha*0.82; }
      if(s.rating==='thick'){ sh*=1.25; sw*=1.05; }
      if(netaKind(t)==='scallop'){ sw=Math.max(sw, sh*1.1); }
      drawNeta(s.x,s.y,t,{w:sw, h:sh, rot:s.rot, drape:0, cutFace:'left'});
      if(s.jagged){
        ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5;
        ctx.beginPath();
        for(let i=0;i<8;i++){
          const yy=s.y-sh/2+i*(sh/7);
          ctx.lineTo(s.x-sw/2+(i%2?3:-1), yy);
        }
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    if(fx.cutFlash>0){
      ctx.fillStyle=`rgba(255,255,255,${fx.cutFlash*0.25})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  function drawShaping(){
    const cx=W/2, cy=H*0.48;
    drawMat(cx, cy+20, 210, 130);
    drawWaterBowl(W*0.82, H*0.16);

    if(!rice.pile.length) buildPileFromRice();
    const taps=state.shapeTaps;
    let mt=0;
    if(taps<=0) mt=0;
    else if(taps<3) mt=0.15+taps*0.1;
    else if(taps<=6) mt=0.45+(taps-3)*0.08;
    else mt=0.85+(taps-6)*0.12;
    rice.morphTarget=mt;
    applyMorphToPile(rice.morph);
    drawGrainPile(cx, cy, rice.pile, 1);

    for(const r of fx.pressRipples){
      ctx.strokeStyle=`rgba(255,255,255,${r.life*0.35})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(cx,cy,20+r.r,12+r.r*0.5,0,0,Math.PI*2); ctx.stroke();
    }

    if(fx.hands.active || fx.hands.press>0.01){
      const p=fx.hands.press;
      const lift=lerp(50, 0, p);
      const spread=lerp(70, 38, p);
      drawHand(cx-spread, cy-8-lift, 0.85, -0.15+p*0.1, true);
      drawHand(cx+spread, cy-8-lift, 0.85, 0.15-p*0.1, false);
    } else if(state.step==='shape'){
      const bob=Math.sin(fx.idle*2)*4;
      ctx.globalAlpha=0.4;
      drawHand(cx-55, cy-40+bob, 0.55, -0.25, true);
      drawHand(cx+55, cy-40+bob, 0.55, 0.25, false);
      ctx.globalAlpha=1;
    }

    if(state.wasabiAmount>0 && state.step!=='shape'){
      const wy=cy-6-clamp(rice.morph,0,1)*5;
      ctx.fillStyle='rgba(40,60,10,0.18)';
      ctx.beginPath(); ctx.ellipse(cx+1, wy+3, 6+state.wasabiAmount*12, 4+state.wasabiAmount*5, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx, wy, 5+state.wasabiAmount*12, 3+state.wasabiAmount*5, 0,0,Math.PI*2);
      const wg=ctx.createRadialGradient(cx-2,cy-8,1,cx,cy-6,14);
      wg.addColorStop(0,'#d4f08a'); wg.addColorStop(0.55,'#8bc34a'); wg.addColorStop(1,'#5a8a22');
      ctx.fillStyle=wg; ctx.fill();
    }

    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    if(state.step==='shape'){
      const label=taps===0?'点「捏一捏」或点饭团': taps<3?'还软软的～': taps<=6?'太棒了，形状刚好': '有点扁了哦';
      ctx.fillText(`${label}  ×${taps}`, cx, cy+95);
    } else {
      ctx.fillText('左右滑动抹芥末', cx, cy+95);
    }
  }

  function drawToppingStep(){
    const cx=W/2, cy=H*0.45;
    drawMat(cx, cy+20, 220, 140);
    const t=state.topping;
    if(t.gunkan){
      drawGunkanShell(cx, cy+6, 1.08, {seed:21+state.pieceIndex});
      let amt=state.scoopAmount;
      if(amt>0) drawGunkanFilling(cx, cy+6, t, amt, 1.08);
      drawSprinkles(cx, cy-8, 50, 28);
      for(const p of fx.spillParts){
        ctx.fillStyle=t.color; ctx.globalAlpha=p.life;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
      }
      if(state.spilled){ ctx.fillStyle='rgba(224,112,80,0.9)'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText('有点满出来啦，再试一次就更棒', cx, cy+88); }
      else { ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('按住舀入 · 松手完成', cx, cy+90); }

      if(!rice.pile.length){ buildPileFromRice(); snapPileToMorph(shariMorphTarget()); }
      rice.morphTarget=shariMorphTarget(); applyMorphToPile(Math.max(rice.morph, 0.4));

        ctx.fillStyle='#8bc34a'; ctx.fill();
      }
      const ax=state.toppingPlaced?(state.toppingAligned-0.5)*40:0;
      let tx=state.toppingPlaced?cx+ax:(state.dragging&&state.lastPointer?state.lastPointer.x:cx+80);
      let ty=state.toppingPlaced?cy-8:(state.dragging&&state.lastPointer?state.lastPointer.y:cy-55);
      const lift=state.toppingPlaced?2:18;
      const kind=netaKind(t);
      const shW=kind==='scallop'?24: kind==='tamago'?34:42;
      ctx.fillStyle=`rgba(30,40,60,${0.14+lift*0.008})`;
      ctx.beginPath(); ctx.ellipse(tx+3, cy+20, shW, 11,0,0,Math.PI*2); ctx.fill();
      const drape=state.draped?1: (state.drapeT||0);
      const sc=state.toppingPlaced?(state.draped?1:0.96):0.92;
      const netaY=state.toppingPlaced?netaOnRiceY(ty,t,sc):ty;

        ctx.beginPath(); ctx.ellipse(cx, cy-5, 70, 36,0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(state.toppingPlaced?(state.draped?'贴合完成 · 去摆盘':'滑动一下贴合鱼片'):'拖到绿色圈里', cx, cy+98);

  function drawPlate(){
    const cx=W/2, cy=H*0.48;
    drawPlateBody(cx, cy, state.plateStyle||'wood');
    const px=cx-16, py=cy;
    if(state.topping && state.topping.gunkan){
      drawMiniNigiri(px, py, state.topping, 1, Math.max(0.55, state.scoopAmount||0.8));
    } else if(state.topping){
      if(!rice.pile.length){ buildPileFromRice(); snapPileToMorph(shariMorphTarget()); }
      rice.morphTarget=shariMorphTarget();
      applyMorphToPile(Math.max(rice.morph, 0.4));
      for(const g of rice.pile){ if(Math.abs(g.x-g.tx)+Math.abs(g.y-g.ty)>8){ g.x=g.tx; g.y=g.ty; g.z=g.tz; } }
      drawGrainPile(px, py+10, rice.pile, 0.72);
      drawNeta(px, netaOnRiceY(py-4, state.topping, 0.72), state.topping, {scale:0.72, drape: state.draped?1: Math.max(0.7, state.drapeT||0)});
    }
    drawSprinkles(px, py-4, 48, 20);
    if(state.gariAmount>0){
      const n=state.gariAmount>=2?1.15:0.85;
      drawGari(cx+58, cy+2, n);
      if(state.gariAmount>=2) drawGari(cx+78, cy+8, 0.75);
    }
    state.pieces.slice(-2).forEach((p,i)=>drawMiniNigiri(cx-78+i*28, cy+22, p.topping, 0.55, Math.max(0.55, p.scoopAmount||0.8)));
  }

  function drawMiniNigiri(x,y,t,alpha,scoop){
    ctx.save(); ctx.globalAlpha=alpha==null?1:alpha;
    if(t.gunkan){
      drawGunkanShell(x, y+2, 0.62, {seed:(t.id?t.id.length:2)*17+((x*3)|0)});
      drawGunkanFilling(x, y+2, t, scoop==null?0.85:scoop, 0.62);
    } else {
      drawMiniShari(x, y+8, 0.9, ((x*10)|(0))+(t.id?t.id.length:1)*13);
      drawNeta(x, netaOnRiceY(y-2, t, 0.48), t, {scale:0.48, drape:1});
    }
    ctx.restore();
  }

  function drawSparkItem(s){
    ctx.save();
    ctx.globalAlpha=Math.max(0,s.life);
    ctx.fillStyle=s.col;
    ctx.translate(s.x,s.y);
    ctx.rotate(s.rot||0);
    const z=s.sz*Math.max(0.2,s.life);
    if(s.kind==='heart'){
      ctx.beginPath();
      ctx.moveTo(0, z*0.35);
      ctx.bezierCurveTo(-z*1.15, -z*0.55, -z*0.45, -z*1.25, 0, -z*0.4);
      ctx.bezierCurveTo(z*0.45, -z*1.25, z*1.15, -z*0.55, 0, z*0.35);
      ctx.fill();
    } else if(s.kind==='star'){
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const r=i%2?z*0.4:z;
        const a=-Math.PI/2+i*Math.PI/5;
        if(i===0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.rotate(Math.PI/4);
      ctx.beginPath();
      ctx.moveTo(0,-z); ctx.lineTo(z*0.22, -z*0.22); ctx.lineTo(z,0); ctx.lineTo(z*0.22,z*0.22);
      ctx.lineTo(0,z); ctx.lineTo(-z*0.22,z*0.22); ctx.lineTo(-z,0); ctx.lineTo(-z*0.22,-z*0.22);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function draw(){
    if(state.screen!=='play') return;
    ctx.save();
    if(fx.screenPulse>0){
      const s=1+fx.screenPulse*0.015;
      ctx.translate(W/2,H/2); ctx.scale(s,s); ctx.translate(-W/2,-H/2);
    }
    drawWoodBg();
    ctx.globalAlpha=fx.fade;
    switch(state.step){
      case 'slice': drawFishBlock(); break;
      case 'wet': case 'rice': drawHangiri(); break;
      case 'shape': drawShaping(); break;
      case 'wasabi': drawWasabi(); break;
      case 'wrap': drawWrap(); break;
      case 'topping': drawToppingStep(); break;
      case 'plate': drawPlate(); break;
    }
    drawSceneMascot();
    for(const s of fx.sparkles) drawSparkItem(s);
    ctx.globalAlpha=1;
    ctx.restore();
  }

  let lastTs=performance.now();
  function needAnim(){ if(!animRunning){ animRunning=true; requestAnimationFrame(tick); } }
  function tick(ts){
    const dt=Math.min(0.05,(ts-lastTs)/1000); lastTs=ts;
    fx.idle+=dt;
    let alive=false;

    if(fx.fade<1){ fx.fade=Math.min(1,fx.fade+dt*3); alive=true; }
    if(fx.mascotCeleb>0){ fx.mascotCeleb=Math.max(0,fx.mascotCeleb-dt); alive=true; }

    for(const tr of fx.knifeTrail){ tr.life-=dt*3; alive=true; }
    fx.knifeTrail=fx.knifeTrail.filter(tr=>tr.life>0);
    if(fx.knifeTrail.length>40) fx.knifeTrail.splice(0, fx.knifeTrail.length-40);

    for(const s of fx.sparkles){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.12; s.rot+=(s.vr||0); s.life-=dt*1.8; alive=true; }
    fx.sparkles=fx.sparkles.filter(s=>s.life>0);

    for(const r of fx.waterRipples){ r.r+=dt*40; r.life-=dt*1.2; alive=true; }
    fx.waterRipples=fx.waterRipples.filter(r=>r.life>0);
    for(const r of fx.pressRipples){ r.r+=dt*50; r.life-=dt*1.5; alive=true; }
    fx.pressRipples=fx.pressRipples.filter(r=>r.life>0);

    if(fx.fishSquash>0){ fx.fishSquash=Math.max(0,fx.fishSquash-dt*2.5); alive=true; }
    if(fx.cutFlash>0){ fx.cutFlash=Math.max(0,fx.cutFlash-dt*2); alive=true; }
    if(fx.screenPulse>0){ fx.screenPulse=Math.max(0,fx.screenPulse-dt*2.2); alive=true; }

    if(fx.slicing && fx.sliceAnim){
      alive=true;
      const a=fx.sliceAnim;
      fx.slicePhase=clamp((performance.now()-a.start)/a.dur,0,1);
      fx.fishSquash=Math.sin(fx.slicePhase*Math.PI)*1.2;
      if(fx.slicePhase>=1){
        fx.slicing=false;
        const rating=a.rating;
        let w=70,h=28;
        if(rating==='thin'){ w=68; h=16; }
        if(rating==='thick'){ w=78; h=40; }
        fx.separated={
          x:W*0.38+20, y:H*0.42, vx:2.2, vy:-1.5, rot:-0.15, vr:0.02,
          w,h, alpha:1, life:0, rating, jagged:a.jagged
        };
        fx.cutFlash=1;
        spawnBurst(W*0.45, H*0.42, rating==='ok'?22:10);
        if(rating==='ok' && !a.jagged){ fx.screenPulse=1; sfxChime(); celebMascot(); }
        else sfxPop();
        const say=rating==='ok'?'太棒了': rating==='thin'?'差一点就好':'再试一次就更棒';
        floatFeedback(say+(a.jagged && rating==='ok'?' · 还是很棒':''), rating==='ok'?'good':'ok');
      }
    }

    if(fx.separated){
      alive=true;
      const s=fx.separated; s.life+=dt;
      if(s.life<0.9){
        s.vy+=18*dt; s.x+=s.vx; s.y+=s.vy; s.rot+=s.vr;
        const landY=H*0.55;
        if(s.y>landY){ s.y=landY; s.vy*=-0.25; s.vx*=0.7; s.vr*=0.5; }
        s.x=lerp(s.x, W*0.78, dt*1.2);
      } else {
        s.x=lerp(s.x, W*0.78, 0.1);
        s.y=lerp(s.y, H*0.55, 0.1);
        s.rot=lerp(s.rot, 0.25, 0.08);
      }
    }

    if(fx.hands.active){
      alive=true;
      fx.hands.t+=dt;
      if(fx.hands.t<0.18) fx.hands.press=easeOutCubic(fx.hands.t/0.18);
      else if(fx.hands.t<0.45) fx.hands.press=1;
      else if(fx.hands.t<0.7) fx.hands.press=1-easeOutCubic((fx.hands.t-0.45)/0.25);
      else { fx.hands.active=false; fx.hands.press=0; }
    }

    if(rice.pile.length && (state.step==='shape'||state.step==='wasabi'||state.step==='topping'||state.step==='wrap'||state.step==='plate')){
      stepPileSprings(dt);
      if(Math.abs(rice.morph-rice.morphTarget)>0.002) alive=true;
      else if(rice.pile.some(g=>Math.abs(g.x-g.tx)+Math.abs(g.y-g.ty)>0.05)) alive=true;
    }

    if(state.riceHolding){ alive=true; state.riceAmount=Math.min(1,(performance.now()-state.riceHoldStart)/1800); }

    if(state._scooping){
      alive=true;
      state.scoopAmount=Math.min(1.2, state.scoopAmount+dt*0.55);
      if(state.scoopAmount>1){
        state.spilled=true;
        if(Math.random()<0.3){
          fx.spillParts.push({x:W/2+(Math.random()-0.5)*40, y:H*0.4, vx:(Math.random()-0.5)*2, vy:-1, r:3+Math.random()*3, life:1});
        }
      }
    }
    for(const p of fx.spillParts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life-=dt*0.8; alive=true; }
    fx.spillParts=fx.spillParts.filter(p=>p.life>0);

    for(const g of fx.flyingGrains){ g.x+=g.vx; g.y+=g.vy; g.vy+=0.2; g.life-=dt; alive=true; }
    fx.flyingGrains=fx.flyingGrains.filter(g=>g.life>0);

    if(state.step==='shape'||state.step==='slice'||state.step==='rice'||state.step==='plate') alive=true;

    draw();
    for(const g of fx.flyingGrains){
      ctx.save(); ctx.globalAlpha=g.life; ctx.translate(g.x,g.y); ctx.rotate(g.rot);
      ctx.fillStyle=g.col; ctx.beginPath(); ctx.ellipse(0,0,g.len/2,g.wid/2,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    if(alive || state.dragging) requestAnimationFrame(tick);
    else animRunning=false;
  }

  function stickerName(id){
    const d=STICKER_DEFS.find(s=>s.id===id);
    return d?d.name:id;
  }
  function uniqueStickerCount(){ return Object.keys(collectedStickers).length; }

  function updateCollectedHint(){
    $('#collected-count').textContent=`已收集称号 ${collectedTitles.length} / ${ALL_TITLES.length}  ·  贴纸 ${uniqueStickerCount()} 种`;
  }

  function renderToppingGrid(){
    const grid=$('#topping-grid'); grid.innerHTML='';
    TOPPINGS.forEach(t=>{
      const card=document.createElement('div'); card.className='topping-card';
      card.innerHTML=`<div class="emoji">${t.emoji}</div><div class="name">${t.name}</div>${t.gunkan?'<span class="tag">军舰</span>':''}`;
      card.addEventListener('click',()=>{ sfxPop(); startPiece(t); });
      grid.appendChild(card);
    });
  }

  function resetPieceState(){
    Object.assign(state,{
      step: state.topping&&state.topping.gunkan?'wet':'slice',
      wetHands:false, sliceCuts:[], sliceRating:null, sliceJagged:false,
      riceAmount:0, riceHolding:false, riceRating:null, stickyPenalty:false,
      shapeTaps:0, firmness:null, wasabiAmount:0, wasabiStrokes:0,
      noriWrapped:false, scoopAmount:0, spilled:false,
      toppingPlaced:false, toppingAligned:0.5, draped:false, drapeT:0, hasGari:false,
      gariAmount:0, plateStyle:'wood', sprinkleSesame:false, sprinkleNori:false,
      dragging:false, dragStart:null, _scooping:false,
    });
    rice.mound=[]; rice.pile=[]; rice.morph=0; rice.morphTarget=0;
    fx.separated=null; fx.slicing=false; fx.knifeTrail=[]; fx.hands.active=false; fx.hands.press=0;
    fx.spillParts=[]; fx.sparkles=[]; fx.fade=0.35;
  }

  function startPiece(topping){
    state.topping=topping; resetPieceState();
    state.step=topping.gunkan?'wet':'slice';
    updateHUD(); renderBoardBar(); renderControls(); updateHint(); showScreen('play');
  }

  function updateHUD(){
    $('#hud-piece').textContent=`第 ${state.pieceIndex+1} 贯`;
    $('#hud-topping').textContent=state.topping?state.topping.emoji+' '+state.topping.name:'';
    $('#hud-step').textContent=STEPS[state.step]||state.step;
    $('#btn-finish-early').style.display=state.pieces.length>0?'block':'none';
    syncMascotClass();
  }

  function renderBoardBar(){
    const bar=$('#board-bar'); bar.innerHTML='';
    const slots=Math.max(3, state.pieces.length+1);
    for(let i=0;i<slots;i++){
      const d=document.createElement('div');
      if(i<state.pieces.length){ d.className='board-piece'; d.textContent=state.pieces[i].emoji; d.title=state.pieces[i].topping.name; }
      else if(i===state.pieces.length && state.topping){ d.className='board-piece'; d.style.opacity='0.5'; d.textContent='…'; }
      else { d.className='board-piece empty'; d.textContent='＋'; }
      bar.appendChild(d);
    }
  }

  function updateHint(){
    let speech=STEP_SPEECH[state.step]||'';
    if(state.step==='topping' && state.topping && state.topping.gunkan) speech='按住往军舰里舀，满满的就松手～';
    if(state.step==='plate') speech='换盘子、加点寿司姜，还可以撒芝麻或海苔碎';
    $('#helper-speech').textContent=speech;
    $('#stage-tip').textContent=STEP_TIPS[state.step]||'';
    syncMascotClass();
  }

  function renderControls(){
    const c=$('#controls'); c.innerHTML='';
    const add=(label,cls,fn)=>{ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=label; b.addEventListener('click',fn); c.appendChild(b); return b; };
    if(state.step==='wet'||(state.step==='rice'&&!state.wetHands)){
      add(state.wetHands?'✓ 已湿手':'💧 湿手','btn-wet btn-lg'+(state.wetHands?' active':''),()=>{
        state.wetHands=true;
        fx.waterRipples.push({r:0,life:1},{r:4,life:0.8});
        spawnBurst(W*0.78,H*0.22,12);
        sfxPop(); celebMascot();
        if(state.step==='wet'){ state.step='rice'; updateHUD(); updateHint(); }
        renderControls(); floatFeedback('手润润的～','good'); needAnim();
      });
    }
    if(state.step==='shape'){
      add('✊ 捏一捏','btn-action btn-lg',()=>{ doShapeTap(); });
      add('下一步 · 芥末','btn-secondary',()=>{ rateFirmness(); state.step='wasabi'; updateHUD(); updateHint(); renderControls(); fx.fade=0.4; needAnim(); });
    }
    if(state.step==='wasabi'){
      add('跳过芥末','btn-secondary',()=>{ state.wasabiAmount=0; goAfterWasabi(); });
    }
    if(state.step==='wrap'){
      add('🌿 包海苔','btn-action btn-lg',()=>{
        state.noriWrapped=true; state.step='topping'; updateHUD(); updateHint(); renderControls();
        floatFeedback('海苔包好了','good'); sfxPop(); spawnBurst(W/2,H*0.4,12); celebMascot(); fx.fade=0.4; needAnim();
      });
    }
    if(state.step==='topping' && !state.topping.gunkan && state.toppingPlaced){
      add(state.draped?'去摆盘 →':'跳过贴合 · 摆盘','btn-action',()=>{
        state.step='plate'; updateHUD(); updateHint(); renderControls(); fx.fade=0.4; needAnim();
      });
    }
    if(state.step==='plate'){
      const row=document.createElement('div'); row.className='diy-row';
      const diy=(label,on,fn)=>{ const b=document.createElement('button'); b.className='btn btn-diy'+(on?' on':''); b.textContent=label; b.addEventListener('click',fn); row.appendChild(b); };
      diy('木盘', state.plateStyle==='wood', ()=>{ state.plateStyle='wood'; renderControls(); needAnim(); });
      diy('黑瓷', state.plateStyle==='black', ()=>{ state.plateStyle='black'; renderControls(); needAnim(); });
      diy('白瓷', state.plateStyle==='white', ()=>{ state.plateStyle='white'; renderControls(); needAnim(); });
      diy('寿司姜 一点', state.gariAmount===1, ()=>{ state.gariAmount=state.gariAmount===1?0:1; state.hasGari=state.gariAmount>0; if(state.hasGari){ floatFeedback('加点姜片','good'); sfxPop(); } renderControls(); needAnim(); });
      diy('寿司姜 多一点', state.gariAmount>=2, ()=>{ state.gariAmount=state.gariAmount>=2?0:2; state.hasGari=state.gariAmount>0; if(state.hasGari){ floatFeedback('姜片点缀','good'); sfxPop(); } renderControls(); needAnim(); });
      diy('芝麻', !!state.sprinkleSesame, ()=>{ state.sprinkleSesame=!state.sprinkleSesame; if(state.sprinkleSesame) sfxPop(); renderControls(); needAnim(); });
      diy('海苔碎', !!state.sprinkleNori, ()=>{ state.sprinkleNori=!state.sprinkleNori; if(state.sprinkleNori) sfxPop(); renderControls(); needAnim(); });
      c.appendChild(row);
      add('✓ 完成这贯','btn-primary btn-lg', finishPiece);
    }
  }

  function goAfterWasabi(){
    state.step=state.topping.gunkan?'wrap':'topping';
    updateHUD(); updateHint(); renderControls(); fx.fade=0.4; needAnim();
  }

  function rateSlice(){
    if(!state.sliceCuts.length){ state.sliceRating='thick'; return; }
    const cut=state.sliceCuts[state.sliceCuts.length-1];
    const len=Math.abs(cut.dy||80);
    state.sliceJagged=state.sliceCuts.length>1||cut.jagged;
    if(len<30) state.sliceRating='thin';
    else if(len>200) state.sliceRating='thick';
    else state.sliceRating='ok';
  }
  function rateRice(){
    const ideal=state.topping.gunkan?0.35:0.55;
    if(state.riceAmount<ideal-0.28) state.riceRating='little';
    else if(state.riceAmount>ideal+0.32) state.riceRating='much';
    else state.riceRating='ok';
  }
  function rateFirmness(){
    if(state.shapeTaps<2) state.firmness='loose';
    else if(state.shapeTaps>10) state.firmness='hard';
    else state.firmness='ok';
    const map={loose:'软软的，再轻轻捏更好',ok:'太棒了，刚刚好',hard:'有点扁了，再试一次就更棒'};
    floatFeedback(map[state.firmness], state.firmness==='ok'?'good':'ok');
    if(state.firmness==='ok'){ sfxChime(); celebMascot(); }
    else sfxPop();
  }

  function scorePiece(){
    let cut=75, riceS=75, firm=75, wasabi=82, align=75, plate=75;
    if(state.topping.gunkan) cut=88;
    else {
      if(state.sliceRating==='ok') cut=state.sliceJagged?82:96;
      else if(state.sliceRating==='thin') cut=70; else cut=68;
    }
    if(state.riceRating==='ok') riceS=94; else if(state.riceRating==='little') riceS=72; else riceS=70;
    if(state.stickyPenalty) riceS=Math.max(60, riceS-12);
    if(state.firmness==='ok') firm=93; else if(state.firmness==='loose') firm=74; else firm=70;
    if(state.wasabiAmount===0) wasabi=80; else if(state.wasabiAmount<0.45) wasabi=96; else if(state.wasabiAmount<0.85) wasabi=80; else wasabi=66;
    if(state.topping.gunkan) align=state.spilled?62:(state.scoopAmount>0.15&&state.scoopAmount<=1?92:74);
    else { align=50+state.toppingAligned*50; if(state.draped) align=Math.min(100,align+10); align=Math.max(68, align); }
    plate=state.hasGari?90:76; if(state.pieces.length>=2) plate+=4;
    if(state.sprinkleSesame||state.sprinkleNori) plate=Math.min(100, plate+3);
    let total=Math.round(cut*0.2+riceS*0.22+firm*0.18+wasabi*0.12+align*0.18+plate*0.1);
    total=Math.round(60+total*0.4);
    return {cut, rice:riceS, firm, wasabi, align, plate, total:Math.max(62,Math.min(100,total))};
  }

  function pickQuirk(scores, pieceStates){
    const quirks=[]; const all=pieceStates; const avg=scores.avg; const last=all[all.length-1];
    if(last){
      if(last.wasabiAmount>0.85) quirks.push('芥末放太多');
      if(last.firmness==='hard') quirks.push('捏得像石头');
      if(last.sliceRating==='thick') quirks.push('切太厚');
      if(last.sliceRating==='thin') quirks.push('切太薄像纸片');
      if(last.riceRating==='much') quirks.push('米饭太多撑爆了');
      if(last.riceRating==='little') quirks.push('米饭太少空空的');
      if(last.stickyPenalty) quirks.push('手还粘着饭');
      if(last.spilled) quirks.push('军舰翻船了');
      if(last.hasGari&&last.scores.total>=85) quirks.push('姜片小达人');
    }
    if(avg>=92&&quirks.length===0) return '传说级握寿司';
    if(avg>=85&&quirks.length===0) return '入口即化';
    if(avg>=80&&quirks.length===0) return '刚刚好的匠人';
    if(avg>=75&&all.every(p=>p.hasGari)) return '摆盘艺术家';
    if(quirks.length===0&&avg>=70) return '没有特别的怪癖放到最满';
    if(quirks.length===0) return '随缘厨师';
    return quirks[0];
  }

  function awardStickersForPiece(piece){
    const got=[];
    if(!piece.topping.gunkan && piece.sliceRating==='ok' && !piece.sliceJagged) got.push('perfect_cut');
    if(piece.riceRating==='ok' && piece.firmness==='ok') got.push('rice_ok');
    if(piece.wasabiAmount>0 && piece.wasabiAmount<0.7) got.push('wasabi_star');
    if(piece.topping.gunkan && !piece.spilled && piece.scoopAmount>=0.2) got.push('gunkan_star');
    if(piece.hasGari) got.push('gari_star');
    if(!got.length || piece.scores.total>=82) got.push('little_chef');
    if(!got.length) got.push('little_chef');
    const uniq=[];
    got.forEach(id=>{ if(!uniq.includes(id)) uniq.push(id); });
    uniq.forEach(id=>{
      saveSticker(id);
      sessionStickers.push(id);
    });
    return uniq;
  }

  function showStickerPop(ids, done){
    const el=$('#sticker-pop');
    if(!ids || !ids.length){ if(done) done(); return; }
    el.innerHTML=ids.map(id=>`<div class="card">${stickerName(id)}</div>`).join('')+'<div class="sub">贴纸收下啦</div>';
    el.classList.add('show');
    sfxChime(); celebMascot();
    spawnBurst(W/2, H*0.4, 20);
    needAnim();
    clearTimeout(showStickerPop._t);
    showStickerPop._t=setTimeout(()=>{ el.classList.remove('show'); el.innerHTML=''; if(done) done(); }, 1200);
  }

  function finishPiece(){
    if(state.step!=='plate'){
      if(!state.sliceRating&&!state.topping.gunkan) rateSlice();
      if(!state.riceRating) rateRice();
      if(!state.firmness) rateFirmness();
    }
    state.hasGari=state.gariAmount>0;
    const scores=scorePiece();
    const piece={
      topping:state.topping, emoji:state.topping.emoji, scores,
      sliceRating:state.sliceRating, riceRating:state.riceRating, firmness:state.firmness,
      wasabiAmount:state.wasabiAmount, stickyPenalty:state.stickyPenalty, spilled:state.spilled,
      hasGari:state.hasGari, toppingAligned:state.toppingAligned, sliceJagged:state.sliceJagged,
      scoopAmount:state.scoopAmount,
      plateStyle:state.plateStyle, gariAmount:state.gariAmount,
      sprinkleSesame:state.sprinkleSesame, sprinkleNori:state.sprinkleNori,
    };
    state.pieces.push(piece);
    state.pieceIndex=state.pieces.length;
    sfxDing();
    spawnBurst(W/2, H*0.45, 24);
    const earned=awardStickersForPiece(piece);
    showStickerPop(earned, ()=>{
      if(state.pieces.length>=3) showResult();
      else { toast(`第 ${state.pieces.length} 贯完成！再选一个食材～`); showScreen('pick'); }
    });
  }

  function showResult(){
    const avg=Math.round(state.pieces.reduce((s,p)=>s+p.scores.total,0)/state.pieces.length);
    const quirk=pickQuirk({avg}, state.pieces);
    const isNew=saveTitle(quirk); updateCollectedHint();
    $('#score-big').textContent=avg; $('#quirk-title').textContent=quirk;
    let cheer='完成一盘就是小师傅！再试一次就更棒！';
    if(avg>=90) cheer='太棒了！这盘寿司香喷喷！';
    else if(avg>=80) cheer='做得真好，再来一盘吧！';
    else if(avg>=70) cheer='很棒哦，再试一次就更棒！';
    $('#result-cheer').textContent=cheer;
    const bd=$('#score-breakdown');
    bd.innerHTML=state.pieces.map((p,i)=>`<div class="row"><span>${i+1}. ${p.topping.name}</span><span>${p.scores.total} 分</span></div>`).join('')+`<div class="row"><span><b>平均</b></span><span><b>${avg}</b></span></div>`;
    const last=state.pieces[state.pieces.length-1].scores;
    bd.innerHTML+=`<div class="row" style="margin-top:8px;color:#7a6550"><span>切工</span><span>${last.cut}</span></div>
      <div class="row" style="color:#7a6550"><span>饭量</span><span>${last.rice}</span></div>
      <div class="row" style="color:#7a6550"><span>紧实度</span><span>${last.firm}</span></div>
      <div class="row" style="color:#7a6550"><span>芥末</span><span>${last.wasabi}</span></div>
      <div class="row" style="color:#7a6550"><span>贴合</span><span>${last.align}</span></div>
      <div class="row" style="color:#7a6550"><span>摆盘</span><span>${last.plate}</span></div>`;
    const wall=$('#sticker-wall');
    const sess=[];
    sessionStickers.forEach(id=>{ if(!sess.includes(id)) sess.push(id); });
    let html='<h3>本盘贴纸墙</h3><div class="sticker-chips">';
    if(sess.length) html+=sess.map(id=>`<span class="sticker-chip">${stickerName(id)}</span>`).join('');
    else html+='<div class="sticker-empty">下一盘再收集贴纸吧</div>';
    html+='</div>';
    const allIds=Object.keys(collectedStickers);
    if(allIds.length){
      html+='<h3 style="margin-top:10px">我的贴纸收藏</h3><div class="sticker-chips">';
      html+=allIds.map(id=>`<span class="sticker-chip alltime">${stickerName(id)} ×${collectedStickers[id]}</span>`).join('');
      html+='</div>';
    }
    wall.innerHTML=html;
    const box=$('#titles-box');
    box.innerHTML='<div style="margin-bottom:6px;font-weight:700">称号收藏</div>'+collectedTitles.map(t=>`<span class="chip${t===quirk&&isNew?' new':''}">${t}${t===quirk&&isNew?' ✨新':''}</span>`).join('');
    showScreen('result');
  }

  function ptr(e){
    const r=canvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]||e.changedTouches[0]:e;
    return {x:((src.clientX-r.left)/r.width)*W, y:((src.clientY-r.top)/r.height)*H};
  }

  function startSliceAnim(cut){
    fx.slicing=true;
    fx.slicePhase=0;
    fx.sliceAnim={ start:performance.now(), dur: cut.jagged?1400:1100, cutY:cut.t, jagged:cut.jagged, rating:state.sliceRating, dy:cut.dy };
    sfxWhoosh();
    needAnim();
    clearTimeout(startSliceAnim._t);
    startSliceAnim._t=setTimeout(()=>{
      state.step='wet'; updateHUD(); updateHint(); renderControls(); fx.fade=0.35; needAnim();
    }, (cut.jagged?1400:1100)+1100);
  }

  function doShapeTap(){
    state.shapeTaps++;
    fx.hands.active=true; fx.hands.t=0; fx.hands.press=0;
    fx.pressRipples.push({r:0,life:1});
    const taps=state.shapeTaps;
    let mt=taps<3?0.15+taps*0.1: taps<=6?0.45+(taps-3)*0.08: 0.85+(taps-6)*0.12;
    rice.morphTarget=mt;
    if(!rice.pile.length) buildPileFromRice();
    applyMorphToPile(rice.morph);
    const msgs=['捏~','再捏','紧一点','太棒了','刚刚好','完美？','轻轻的','有点扁了哦'];
    floatFeedback(msgs[Math.min(msgs.length-1,taps-1)], taps<=6?'ok':'ok');
    sfxPop();
    if(taps>=3 && taps<=6){ spawnBurst(W/2,H*0.48,12); if(taps===4){ sfxChime(); celebMascot(); } }
    needAnim();
  }

  function onDown(e){
    if(state.screen!=='play') return;
    e.preventDefault();
    unlockAudio();
    if(fx.slicing) return;
    const p=ptr(e);
    state.dragging=true; state.dragStart=p; state.lastPointer=p;
    canvas.classList.add('grabbing');

    if(state.step==='rice'){
      if(!state.wetHands){ state.stickyPenalty=true; floatFeedback('下次先点水就更好啦','ok'); toast('先点「湿手」再抓饭'); }
      state.riceHolding=true;
      state.riceHoldStart=performance.now()-state.riceAmount*1800;
      sfxPop();
      needAnim();
    }
    if(state.step==='shape'){
      doShapeTap();
    }
    if(state.step==='topping'&&state.topping.gunkan){ state._scooping=true; needAnim(); }
    needAnim();
  }

  function onMove(e){
    if(!state.dragging) return;
    e.preventDefault();
    const p=ptr(e); state.lastPointer=p;
    if(state.step==='wasabi'){
      const dx=Math.abs(p.x-(state.dragStart?state.dragStart.x:p.x));
      if(dx>8){ state.wasabiAmount=Math.min(1.2,state.wasabiAmount+0.02); state.wasabiStrokes++; state.dragStart=p; }
    }
    if(state.step==='topping'&&!state.topping.gunkan&&state.toppingPlaced&&!state.draped){
      const dy=Math.abs(p.y-state.dragStart.y), dx=Math.abs(p.x-state.dragStart.x);
      state.drapeT=clamp((dx+dy)/80,0,1);
      if(dx+dy>30){ state.draped=true; floatFeedback('太棒了，贴合啦','good'); spawnBurst(W/2,H*0.42,14); sfxChime(); celebMascot(); renderControls(); }
    }
    needAnim();
  }

  function onUp(e){
    if(!state.dragging&&!state.riceHolding&&!state._scooping) return;
    e.preventDefault();
    const p=state.lastPointer||ptr(e);
    canvas.classList.remove('grabbing');

    if(state.step==='slice'&&state.dragStart&&!fx.slicing){
      const dy=p.y-state.dragStart.y;
      const dx=Math.abs(p.x-state.dragStart.x);
      if(dy>30){
        const jagged=dx>40||state.sliceCuts.length>0;
        const cut={ t:clamp((state.dragStart.y-H*0.42+39)/78,0.15,0.85), dy, jagged };
        state.sliceCuts.push(cut);
        rateSlice();
        startSliceAnim(cut);
      }
    }

    if(state.step==='rice'&&state.riceHolding){
      state.riceHolding=false;
      state.riceAmount=Math.min(1,(performance.now()-state.riceHoldStart)/1800);
      rateRice();
      const map={little:'饭有点少，再抓一点点就更棒',ok:'太棒了，分量刚好',much:'饭有点多啦，下次少一点点'};
      floatFeedback(map[state.riceRating], state.riceRating==='ok'?'good':'ok');
      if(state.riceRating==='ok'){ sfxChime(); spawnBurst(W*0.42,H*0.4,12); celebMascot(); }
      else sfxPop();
      setTimeout(()=>{
        state.step='shape'; buildPileFromRice(); updateHUD(); updateHint(); renderControls(); fx.fade=0.35; needAnim();
      },450);
    }

    if(state.step==='wasabi'){
      if(state.wasabiAmount>0.85) floatFeedback('芥末有点多，下次少一点就更棒','ok');
      else if(state.wasabiAmount>0){ floatFeedback('太棒了','good'); sfxChime(); celebMascot(); }
      setTimeout(()=>goAfterWasabi(),400);
    }

    if(state.step==='topping'&&!state.topping.gunkan){
      if(!state.toppingPlaced){
        const cx=W/2, cy=H*0.45;
        const dist=Math.hypot(p.x-cx,p.y-(cy-5));
        if(dist<110){
          state.toppingPlaced=true;
          state.toppingAligned=clamp(0.5+(p.x-cx)/120,0,1);
          if(Math.abs(p.x-cx)<40) state.toppingAligned=0.5;
          floatFeedback('放上去了','good'); sfxPop(); spawnSparkles(cx,cy-8,10,shade(state.topping.color,30)); renderControls();
        }
        else floatFeedback('再靠近一点就好','ok');
      } else if(state.draped){
        state.step='plate'; updateHUD(); updateHint(); renderControls(); fx.fade=0.35; needAnim();
      }
    }

    if(state.step==='topping'&&state.topping.gunkan&&state._scooping){
      state._scooping=false;
      if(state.scoopAmount>1.05){ state.spilled=true; floatFeedback('有点满出来啦，再试一次就更棒','ok'); }
      else if(state.scoopAmount<0.15) floatFeedback('再舀一点点就更棒','ok');
      else { floatFeedback('太棒了，装满了','good'); sfxChime(); celebMascot(); spawnBurst(W/2,H*0.4,12); }
      state.toppingPlaced=true;
      setTimeout(()=>{ state.step='plate'; updateHUD(); updateHint(); renderControls(); fx.fade=0.35; needAnim(); },500);
    }

    state.dragging=false; state.dragStart=null; needAnim();
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp, {passive:false});
  canvas.addEventListener('touchcancel', onUp, {passive:false});

  function newPlate(){
    state.pieces=[]; state.pieceIndex=0; sessionStickers=[];
    renderToppingGrid(); showScreen('pick');
  }

  $('#btn-start').addEventListener('click',()=>{ unlockAudio(); sfxPop(); newPlate(); });
  $('#btn-howto').addEventListener('click',()=>{ toast('选食材 → 切鱼 → 湿手抓饭 → 捏饭 → 芥末 → 放食材 → 摆盘。摆盘时可换盘子、加寿司姜。捏满3贯评分！'); });
  $('#btn-again').addEventListener('click',()=>{ sfxPop(); newPlate(); });
  $('#btn-home').addEventListener('click',()=>{ updateCollectedHint(); showScreen('start'); });
  $('#btn-finish-early').addEventListener('click',()=>{
    if(state.pieces.length===0){ toast('至少完成 1 贯再收工哦'); return; }
    showResult();
  });
  $('#btn-mute').addEventListener('click', toggleMute);
  $('#btn-mute-start').addEventListener('click', toggleMute);
  ['pointerdown','touchstart','click'].forEach(ev=>{
    document.addEventListener(ev, unlockAudio, {passive:true});
  });
  window.addEventListener('resize',()=>{ if(state.screen==='play') resize(); });

  const footerEl=$('#game-footer');
  if(footerEl) footerEl.textContent=FOOTER_TEXT;
  updateMuteButtons();
  updateCollectedHint(); renderToppingGrid();
})();

</script>
</body>
</html>
