<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>捏盘寿司吃吃🍣</title>
<style>
:root{
  --wood:#c4a574;--wood-dark:#8b6914;--wood-light:#e8d5b5;
  --mat:#2a4a7a;--mat-dark:#1a3258;--cream:#faf6f0;--ink:#3d2b1f;
  --accent:#c45c48;--rice:#f5f0e6;--nori:#1a3a28;
  --success:#4a9b6e;--warn:#d4a017;--bad:#c45c48;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:linear-gradient(160deg,#2a1f14 0%,#4a3728 40%,#3d2b1f 100%);color:var(--ink);touch-action:none;user-select:none}
#app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;background:linear-gradient(180deg,#f0e6d8 0%,#e8dcc8 50%,#d4c4a8 100%);box-shadow:0 0 40px rgba(0,0,0,.4)}
.screen{display:none;flex:1;flex-direction:column;min-height:0;position:relative}
.screen.active{display:flex}
#screen-start{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.35),transparent 60%),linear-gradient(180deg,#f5ebe0 0%,#e0d0b8 100%);text-align:center;padding:24px;gap:12px}
.logo-sushi{font-size:72px;line-height:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.15))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title-main{font-size:28px;font-weight:800;letter-spacing:.06em}
.title-sub{font-size:13px;color:#7a6550;margin-bottom:8px}
.btn{border:none;border-radius:999px;padding:14px 36px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s,background .15s,filter .15s;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn-primary{background:linear-gradient(180deg,#e07058,#c45c48);color:#fff;min-width:180px}
.btn-primary:hover{filter:brightness(1.05)}
.btn-secondary{background:linear-gradient(180deg,#f5efe6,#e8dcc8);color:var(--ink);border:2px solid #c4a574}
.btn-ghost{background:transparent;color:#7a6550;box-shadow:none;font-size:14px;padding:8px 16px}
.btn-wet{background:linear-gradient(180deg,#6eb8e8,#4a90c8);color:#fff}
.btn-wet.active{background:linear-gradient(180deg,#4a9b6e,#3a7a56)}
.btn-action{background:linear-gradient(180deg,#e8c070,#d4a017);color:#fff}
.collected-hint{font-size:12px;color:#9a8068;margin-top:16px}
.hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border-bottom:1px solid rgba(139,105,20,.15);flex-shrink:0;z-index:20}
.hud-left{display:flex;flex-direction:column;gap:2px}
.hud-piece{font-size:12px;font-weight:700;color:var(--accent)}
.hud-topping{font-size:16px;font-weight:800}
.hud-step{font-size:12px;color:#7a6550;background:rgba(255,255,255,.7);padding:4px 10px;border-radius:999px}
.hud-done{font-size:12px;font-weight:700;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:inherit}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.stage-hint{text-align:center;padding:6px 16px 2px;font-size:13px;color:#6a5540;flex-shrink:0}
.stage-tip{text-align:center;padding:0 18px 6px;font-size:11px;color:#8a7358;flex-shrink:0;line-height:1.35;min-height:1.35em}
.stage-canvas-wrap{flex:1;min-height:0;position:relative;margin:0 12px 8px;border-radius:16px;overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.1)}
canvas#game{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#game.grabbing{cursor:grabbing}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 12px 16px;flex-shrink:0}
.float-fb{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:22px;font-weight:800;pointer-events:none;z-index:50;text-shadow:0 2px 10px rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.12);animation:floatUp 1.35s cubic-bezier(.2,.7,.2,1) forwards;white-space:nowrap}
.float-fb.good{color:var(--success)}.float-fb.ok{color:var(--warn)}.float-fb.bad{color:var(--bad)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.72);filter:blur(2px)}12%{opacity:1;transform:translate(-50%,-48%) scale(1.12);filter:blur(0)}30%{transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-105%) scale(.96)}}
#screen-pick{background:linear-gradient(180deg,#f5ebe0,#e8dcc8)}
.pick-header{padding:16px 16px 8px;text-align:center}
.pick-header h2{font-size:20px;margin-bottom:4px}
.pick-header p{font-size:12px;color:#7a6550}
.topping-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px 24px;overflow-y:auto;flex:1}
.topping-card{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .12s,border-color .12s,box-shadow .12s}
.topping-card:active{transform:scale(.96)}
.topping-card:hover{border-color:var(--wood);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.topping-card .emoji{font-size:36px;line-height:1.2}
.topping-card .name{font-size:13px;font-weight:700;margin-top:4px}
.topping-card .tag{font-size:10px;color:#fff;background:var(--nori);border-radius:999px;padding:2px 6px;margin-top:4px;display:inline-block}
.board-bar{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;flex-shrink:0;background:rgba(139,105,20,.12)}
.board-piece{flex-shrink:0;width:52px;height:40px;border-radius:8px;background:linear-gradient(180deg,#d4b896,#b8956a);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 4px rgba(0,0,0,.15);border:1px solid rgba(0,0,0,.08)}
.board-piece.empty{opacity:.4;font-size:14px;color:#8b6914}
#screen-result{align-items:center;justify-content:flex-start;padding:24px 20px;overflow-y:auto;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.4),transparent 50%),linear-gradient(180deg,#f5ebe0,#e0d0b8);text-align:center;gap:10px}
.score-big{font-size:64px;font-weight:900;color:var(--accent);line-height:1}
.score-label{font-size:14px;color:#7a6550}
.quirk-title{font-size:20px;font-weight:800;color:var(--ink);background:rgba(255,255,255,.7);padding:12px 20px;border-radius:16px;margin:8px 0;max-width:100%}
.score-breakdown{width:100%;text-align:left;background:rgba(255,255,255,.6);border-radius:14px;padding:12px 16px;font-size:13px}
.score-breakdown .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.score-breakdown .row:last-child{border-bottom:none}
.titles-collected{width:100%;text-align:left;font-size:12px;color:#6a5540}
.titles-collected .chip{display:inline-block;background:#fff;border-radius:999px;padding:4px 10px;margin:3px;border:1px solid var(--wood)}
.titles-collected .chip.new{background:#fff3cd;border-color:var(--warn);font-weight:700}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(61,43,31,.9);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="screen-start" class="screen active">
    <div class="logo-sushi">🍣</div>
    <div class="title-main">捏盘寿司吃吃</div>
    <div class="title-sub">放松一下，亲手捏一盘握寿司</div>
    <button class="btn btn-primary" id="btn-start">开始</button>
    <button class="btn btn-ghost" id="btn-howto">怎么玩？</button>
    <div class="collected-hint" id="collected-count">已收集称号 0 / ?</div>
  </div>
  <div id="screen-pick" class="screen">
    <div class="pick-header">
      <h2>选一个食材</h2>
      <p>军舰卷会标注「军舰」· 捏满 3 贯可结束（也可提前收工）</p>
    </div>
    <div class="topping-grid" id="topping-grid"></div>
  </div>
  <div id="screen-play" class="screen">
    <div class="hud">
      <div class="hud-left">
        <span class="hud-piece" id="hud-piece">第 1 贯</span>
        <span class="hud-topping" id="hud-topping">金枪鱼</span>
      </div>
      <span class="hud-step" id="hud-step">切鱼</span>
      <button class="hud-done" id="btn-finish-early">收工评分</button>
    </div>
    <div class="board-bar" id="board-bar"></div>
    <div class="stage">
      <div class="stage-hint" id="stage-hint">向下滑动切鱼片</div>
      <div class="stage-tip" id="stage-tip"></div>
      <div class="stage-canvas-wrap">
        <canvas id="game"></canvas>
      </div>
      <div class="controls" id="controls"></div>
    </div>
  </div>
  <div id="screen-result" class="screen">
    <div class="score-label">本盘综合评分</div>
    <div class="score-big" id="score-big">0</div>
    <div class="quirk-title" id="quirk-title">没有特别的怪癖放到最满</div>
    <div class="score-breakdown" id="score-breakdown"></div>
    <div class="titles-collected" id="titles-box"></div>
    <button class="btn btn-primary" id="btn-again" style="margin-top:12px">再捏一盘</button>
    <button class="btn btn-secondary" id="btn-home">回首页</button>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
(function () {
  'use strict';

  const TOPPINGS = [
    { id:'tuna', name:'金枪鱼', emoji:'🐟', color:'#c23b3b', fat:'#f0c8c8', gunkan:false },
    { id:'salmon', name:'三文鱼', emoji:'🧡', color:'#e8917a', fat:'#fff5ee', gunkan:false },
    { id:'yellowtail', name:'鰤鱼', emoji:'💛', color:'#e8c070', fat:'#fff8e8', gunkan:false },
    { id:'seabream', name:'鲷鱼', emoji:'🤍', color:'#f0d8c8', fat:'#ffffff', gunkan:false },
    { id:'squid', name:'鱿鱼', emoji:'🦑', color:'#e8e4dc', fat:'#ffffff', gunkan:false },
    { id:'chutoro', name:'中腹', emoji:'❤️', color:'#d4506a', fat:'#fce4ec', gunkan:false },
    { id:'aji', name:'鯵鱼', emoji:'💚', color:'#8fbc8f', fat:'#e8f5e9', gunkan:false },
    { id:'scallop', name:'扇贝', emoji:'🐚', color:'#f5e6c8', fat:'#fffaf0', gunkan:false },
    { id:'shrimp', name:'虾', emoji:'🦐', color:'#f08080', fat:'#ffe4e1', gunkan:false },
    { id:'tamago', name:'玉子烧', emoji:'🥚', color:'#f5d76e', fat:'#fff8dc', gunkan:false },
    { id:'ikura', name:'鲑鱼籽', emoji:'🟠', color:'#e85d04', fat:'#ffb703', gunkan:true },
    { id:'uni', name:'海胆', emoji:'🟠', color:'#f4a261', fat:'#ffe0b2', gunkan:true },
    { id:'negitoro', name:'葱花金枪鱼', emoji:'🧅', color:'#c45c6a', fat:'#e8f5e9', gunkan:true },
    { id:'tobiko', name:'飞鱼籽', emoji:'🔴', color:'#c1121f', fat:'#ff6b6b', gunkan:true },
  ];

  const STEPS = { slice:'切鱼', wet:'湿手', rice:'抓饭', shape:'捏饭', wasabi:'抹芥末', wrap:'包海苔', topping:'放食材', plate:'摆盘' };

  const STEP_TIPS = {
    slice: '📚 握寿司鱼片约 0.8–1.2cm：太薄易散，太厚难入口；一刀直切切口最美',
    wet: '📚 手蘸「手水」(tezu) 可防粘、保饭粒完整，是职人基本功',
    rice: '📚 一口量约 15–20g；军舰饭更少，给籽类留空间',
    shape: '📚 轻轻捏出椭圆饭台：太松散掉，太硬咬不动——「还太松→刚好→别成石头」',
    wasabi: '📚 芥末抹在饭与鱼之间：保温、杀菌，也让辛香缓缓散开',
    wrap: '📚 军舰用海苔围边，装松软籽类/海胆，和握寿司做法不同',
    topping: '📚 鱼片抚平贴合饭台；军舰则舀入馅料，溢出会洒',
    plate: '📚 姜片(gari)清口换味，不是配着一起吃哦',
  };

  const ALL_TITLES = [
    '没有特别的怪癖放到最满','入口即化','传说级握寿司','芥末放太多','捏得像石头',
    '切太厚','切太薄像纸片','米饭太多撑爆了','米饭太少空空的','手还粘着饭',
    '军舰翻船了','摆盘艺术家','刚刚好的匠人','随缘厨师','生姜刺客',
  ];

  const RICE_COLORS = ['#fffef9','#fff8ee','#f5efe4','#e8dcc8','#faf6f0','#f0e8d8'];

  // ---------- State ----------
  const state = {
    screen:'start', pieceIndex:0, pieces:[], topping:null, step:'slice',
    wetHands:false,
    sliceCuts:[], sliceRating:null, sliceJagged:false,
    riceAmount:0, riceHolding:false, riceHoldStart:0, riceRating:null, stickyPenalty:false,
    shapeTaps:0, firmness:null,
    wasabiAmount:0, wasabiStrokes:0,
    noriWrapped:false, scoopAmount:0, spilled:false,
    toppingPlaced:false, toppingAligned:0.5, draped:false, drapeT:0,
    hasGari:false,
    dragging:false, dragStart:null, lastPointer:null,
    _scooping:false,
  };

  // Visual / FX state
  const fx = {
    t0: performance.now(),
    knifeTrail: [],
    sparkles: [],
    waterRipples: [],
    pressRipples: [],
    spillParts: [],
    flyingGrains: [],
    // slice drama
    slicing: false, // animating cut
    slicePhase: 0, // 0..1 during cut anim
    sliceAnim: null, // {start, dur, cutY, jagged, rating, dy}
    fishSquash: 0,
    separated: null, // {x,y,vx,vy,rot,vr,w,h,alpha,life,rating,jagged}
    blockFace: 0.5, // cut face position on block (0-1 from left conceptually - we use vertical cut index)
    cutFlash: 0,
    screenPulse: 0,
    // hands
    hands: { active:false, t:0, press:0 },
    // step fade
    fade: 1,
    idle: 0,
  };

  // Rice particle system
  const rice = {
    bedCanvas: null, bedW:0, bedH:0,
    mound: [], // grains while grabbing
    pile: [],  // grains on mat (shape+)
    pileSeed: 1,
    morph: 0, // 0 loose .. 1 firm .. >1 flat
    morphTarget: 0,
    targetCount: 0,
  };

  let collectedTitles = loadTitles();
  function loadTitles(){ try{ return JSON.parse(localStorage.getItem('sushi_titles')||'[]'); }catch(e){ return []; } }
  function saveTitle(t){ if(!collectedTitles.includes(t)){ collectedTitles.push(t); localStorage.setItem('sushi_titles', JSON.stringify(collectedTitles)); return true;} return false; }

  // ---------- Seeded RNG ----------
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function shade(hex, amt){
    const n=parseInt(hex.slice(1),16);
    let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
    r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function easeInOut(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // ---------- DOM ----------
  const $=s=>document.querySelector(s);
  const canvas=$('#game');
  const ctx=canvas.getContext('2d');
  let W=360,H=400,dpr=1;
  let animRunning=false;

  function resize(){
    const wrap=canvas.parentElement;
    const rect=wrap.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(280,rect.width); H=Math.max(280,rect.height);
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    rice.bedCanvas=null; // rebuild bed
    needAnim();
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $('#screen-'+id).classList.add('active');
    state.screen=id;
    if(id==='play'){ requestAnimationFrame(()=>{ resize(); needAnim(); }); }
  }

  function toast(msg){
    const el=$('#toast'); el.textContent=msg; el.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2400);
  }
  function floatFeedback(text, kind){
    const wrap=canvas.parentElement;
    const el=document.createElement('div');
    el.className='float-fb '+(kind||'ok'); el.textContent=text;
    wrap.appendChild(el); setTimeout(()=>el.remove(),1400);
  }

  function spawnSparkles(x,y,n,col){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
      fx.sparkles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,col:col||'#fff8e0',sz:2+Math.random()*3});
    }
  }

  // ---------- Rice grains ----------
  function makeGrain(rng, ox, oy, oz){
    return {
      ox, oy, oz: oz||0,
      x:ox, y:oy, z:oz||0,
      tx:ox, ty:oy, tz:oz||0,
      rot:(rng()*Math.PI),
      len:5+rng()*2.2,
      wid:2.4+rng()*1.1,
      col:RICE_COLORS[(rng()*RICE_COLORS.length)|0],
      stick: rng()<0.08,
    };
  }

  function buildHangiriBed(){
    const bw=220, bh=120;
    const c=document.createElement('canvas');
    c.width=bw*dpr; c.height=bh*dpr;
    const g=c.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    const rng=mulberry32(42);
    // fill ellipse with dense grains
    for(let i=0;i<360;i++){
      const u=rng(), v=rng();
      const ang=u*Math.PI*2;
      const rad=Math.sqrt(v)*0.92;
      const x=bw/2+Math.cos(ang)*rad*90;
      const y=bh/2+Math.sin(ang)*rad*40;
      const rot=rng()*Math.PI;
      const len=4.5+rng()*2, wid=2.2+rng()*1;
      g.save(); g.translate(x,y); g.rotate(rot);
      g.fillStyle=RICE_COLORS[(rng()*RICE_COLORS.length)|0];
      g.beginPath(); g.ellipse(0,0,len/2,wid/2,0,0,Math.PI*2); g.fill();
      // tiny highlight
      g.globalAlpha=0.35; g.fillStyle='#fff';
      g.beginPath(); g.ellipse(-len*0.15,-wid*0.15,len*0.18,wid*0.18,0,0,Math.PI*2); g.fill();
      g.globalAlpha=1; g.restore();
    }
    rice.bedCanvas=c; rice.bedW=bw; rice.bedH=bh;
  }

  function syncMoundGrains(amt){
    const target=Math.floor(40+amt*140); // 40..180
    rice.targetCount=target;
    const rng=mulberry32(1000+((amt*1000)|0));
    while(rice.mound.length<target){
      const i=rice.mound.length;
      const t=i/Math.max(1,target);
      const ang=rng()*Math.PI*2;
      const rad=Math.sqrt(rng())*(12+amt*28);
      const h=rng()*(10+amt*36)*(1-rad/(12+amt*28+1));
      const g=makeGrain(rng, Math.cos(ang)*rad*0.85, -h, Math.sin(ang)*rad*0.35);
      // fly-in from hangiri edge
      g.x=g.ox-30-rng()*40; g.y=g.oy+20; g.fly=1;
      rice.mound.push(g);
      if(state.stickyPenalty && rng()<0.12){
        fx.flyingGrains.push({x:W*0.5+g.x, y:H*0.42+g.y, vx:(rng()-0.5)*2, vy:-1-rng(), life:1, col:g.col, len:g.len, wid:g.wid, rot:g.rot});
      }
    }
    if(rice.mound.length>target) rice.mound.length=target;
  }

  function buildPileFromRice(){
    const amt=state.riceAmount||0.4;
    const n=Math.floor(70+amt*160); // 70-230
    rice.pileSeed=(state.pieceIndex+1)*997+(state.topping?state.topping.id.length:0)*13+((amt*100)|0);
    const rng=mulberry32(rice.pileSeed);
    rice.pile=[];
    rice.morph=0; rice.morphTarget=0;
    for(let i=0;i<n;i++){
      const ang=rng()*Math.PI*2;
      const rad=Math.sqrt(rng());
      // loose tall irregular mound
      const rx=28+amt*18, ry=18+amt*10;
      const ox=Math.cos(ang)*rad*rx;
      const oz=Math.sin(ang)*rad*ry*0.55;
      const h=(1-rad)*(22+amt*16)*(0.7+rng()*0.6);
      const g=makeGrain(rng, ox, -h, oz);
      g.baseOx=ox; g.baseOy=-h; g.baseOz=oz; g.rad=rad; g.ang=ang;
      rice.pile.push(g);
    }
  }

  function applyMorphToPile(morph){
    // morph 0=loose tall, 0.45=nice oval, 1=flat puck
    const m=clamp(morph,0,1.35);
    rice.morph=m;
    for(const g of rice.pile){
      const rad=g.rad, ang=g.ang;
      let rx, ry, hMul, flatten;
      if(m<0.5){
        const t=m/0.5;
        rx=lerp(32, 36, t); ry=lerp(20, 22, t);
        hMul=lerp(1.0, 0.72, t);
        flatten=lerp(0, 0.15, t);
      } else {
        const t=(m-0.5)/0.5;
        rx=lerp(36, 42, t); ry=lerp(22, 16, t);
        hMul=lerp(0.72, 0.28, t);
        flatten=lerp(0.15, 0.7, t);
      }
      const ox=Math.cos(ang)*rad*rx*(1-flatten*0.1);
      const oz=Math.sin(ang)*rad*ry;
      const h=(1-rad)*(24)*(hMul)*(0.75+((g.len%1)*0.4));
      g.tx=ox; g.tz=oz; g.ty=-Math.max(1.5, h);
      // overpress: grains splay outward
      if(m>1){
        const e=m-1;
        g.tx*=1+e*0.35; g.tz*=1+e*0.2; g.ty*=Math.max(0.15,1-e);
      }
    }
  }

  function stepPileSprings(dt){
    const k=Math.min(1, dt*10);
    for(const g of rice.pile){
      g.x=lerp(g.x,g.tx,k); g.y=lerp(g.y,g.ty,k); g.z=lerp(g.z,g.tz,k);
    }
    // morph ease
    rice.morph=lerp(rice.morph, rice.morphTarget, Math.min(1,dt*6));
  }

  function drawGrainAt(g, cx, cy, scale, shadow){
    const sx=cx+g.x*scale, sy=cy+(g.y+g.z*0.35)*scale;
    if(shadow){
      ctx.fillStyle='rgba(40,30,20,0.12)';
      ctx.beginPath(); ctx.ellipse(sx+1, cy+8*scale+(g.z*0.1), g.len*0.45*scale, g.wid*0.35*scale, g.rot,0,Math.PI*2); ctx.fill();
    }
    ctx.save();
    ctx.translate(sx,sy); ctx.rotate(g.rot);
    const lw=g.len*scale, ww=g.wid*scale;
    // body
    const grd=ctx.createLinearGradient(-lw/2,0,lw/2,0);
    grd.addColorStop(0, shade(g.col,-8));
    grd.addColorStop(0.45, g.col);
    grd.addColorStop(1, shade(g.col,12));
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.ellipse(0,0,lw/2,ww/2,0,0,Math.PI*2); ctx.fill();
    // gloss
    ctx.globalAlpha=0.4; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(-lw*0.12,-ww*0.18,lw*0.2,ww*0.22,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();
  }

  function drawGrainPile(cx, cy, grains, scale){
    scale=scale||1;
    // soft pile shadow
    ctx.fillStyle='rgba(30,40,60,0.18)';
    ctx.beginPath();
    const firm=clamp(rice.morph,0,1);
    ctx.ellipse(cx, cy+10*scale, lerp(34,40,firm)*scale, lerp(16,12,firm)*scale, 0,0,Math.PI*2);
    ctx.fill();
    // sort by depth (y+z)
    const sorted=grains.slice().sort((a,b)=>(a.y+a.z)-(b.y+b.z));
    for(const g of sorted) drawGrainAt(g, cx, cy, scale, false);
  }

  // ---------- Drawing helpers ----------
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawWoodBg(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#efe4d2'); g.addColorStop(1,'#d4c0a0');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(139,105,20,0.07)'; ctx.lineWidth=1.2;
    for(let y=16;y<H;y+=22){
      ctx.beginPath(); ctx.moveTo(0,y);
      for(let x=0;x<W;x+=16) ctx.lineTo(x, y+Math.sin(x*0.04+y*0.02)*2.5);
      ctx.stroke();
    }
  }

  function drawMat(cx,cy,w,h){
    // soft shadow
    ctx.fillStyle='rgba(30,40,70,0.15)';
    roundRect(cx-w/2+3, cy-h/2+5, w, h, 14); ctx.fill();
    roundRect(cx-w/2, cy-h/2, w, h, 12);
    const g=ctx.createLinearGradient(cx,cy-h/2,cx,cy+h/2);
    g.addColorStop(0,'#3a5f9a'); g.addColorStop(1,'#243f6e');
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=2.5; ctx.stroke();
    // weave grid
    ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1;
    for(let i=-w/2+6;i<w/2;i+=7){ ctx.beginPath(); ctx.moveTo(cx+i,cy-h/2+4); ctx.lineTo(cx+i,cy+h/2-4); ctx.stroke(); }
    for(let j=-h/2+6;j<h/2;j+=7){ ctx.beginPath(); ctx.moveTo(cx-w/2+4,cy+j); ctx.lineTo(cx+w/2-4,cy+j); ctx.stroke(); }
  }

  function drawWaterBowl(cx,cy,rippling){
    ctx.fillStyle='rgba(40,40,50,0.12)';
    ctx.beginPath(); ctx.ellipse(cx+2,cy+10,22,8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx,cy,20,12,0,0,Math.PI*2);
    ctx.fillStyle='#f8f8f6'; ctx.fill();
    ctx.strokeStyle='rgba(180,180,175,0.8)'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx,cy-2,14,7,0,0,Math.PI*2);
    const wg=ctx.createRadialGradient(cx-3,cy-4,1,cx,cy,14);
    wg.addColorStop(0,'#c8e8f8'); wg.addColorStop(1,'#6eb0d8');
    ctx.fillStyle=wg; ctx.fill();
    // ripples
    for(const r of fx.waterRipples){
      ctx.strokeStyle=`rgba(255,255,255,${r.life*0.5})`;
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.ellipse(cx,cy-2,6+r.r,3+r.r*0.5,0,0,Math.PI*2); ctx.stroke();
    }
    if(state.wetHands){
      ctx.fillStyle='rgba(74,155,110,0.85)';
      ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText('湿', cx, cy+22);
    }
  }

  // Realistic sashimi slice / block
  function drawSashimiFlesh(x,y,w,h,rot,t,opts){
    opts=opts||{};
    const col=t.color, fat=t.fat||'#fff5ee';
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot||0);
    if(opts.scaleX) ctx.scale(opts.scaleX, opts.scaleY||1);
    // bend for drape
    const bend=opts.bend||0;
    roundRect(-w/2, -h/2, w, h, opts.r||Math.min(10,h*0.35));
    const g=ctx.createLinearGradient(-w/2,0,w/2,0);
    g.addColorStop(0, shade(col,-22));
    g.addColorStop(0.35, col);
    g.addColorStop(0.7, shade(col,18));
    g.addColorStop(1, shade(col,-8));
    ctx.fillStyle=g; ctx.fill();
    // marbling / fat lines
    ctx.save();
    ctx.clip();
    ctx.strokeStyle=fat; ctx.globalAlpha=0.55; ctx.lineWidth=1.4; ctx.lineCap='round';
    const lines=opts.lines||6;
    for(let i=0;i<lines;i++){
      const yy=-h/2+6+i*(h-10)/(lines-0.5);
      ctx.beginPath();
      ctx.moveTo(-w/2+4, yy+bend*Math.sin(i));
      ctx.quadraticCurveTo(0, yy-3+i*0.3+bend, w/2-4, yy+2);
      ctx.stroke();
      if(i%2===0){
        ctx.globalAlpha=0.28;
        ctx.beginPath();
        ctx.moveTo(-w/2+10, yy+4);
        ctx.quadraticCurveTo(w*0.1, yy+1, w/2-8, yy+5);
        ctx.stroke();
        ctx.globalAlpha=0.55;
      }
    }
    // top gloss
    ctx.globalAlpha=0.22; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(-w*0.1,-h*0.22,w*0.28,h*0.18, -0.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // outline soft
    ctx.strokeStyle='rgba(80,40,30,0.18)'; ctx.lineWidth=1; 
    roundRect(-w/2,-h/2,w,h,opts.r||Math.min(10,h*0.35)); ctx.stroke();
    // juicy cut face
    if(opts.cutFace){
      const face=opts.cutFace; // 'left'|'right'|'bottom'
      ctx.globalAlpha=0.9;
      if(face==='right'){
        const cg=ctx.createLinearGradient(w/2-2,-h/2,w/2+6,h/2);
        cg.addColorStop(0, shade(col,30)); cg.addColorStop(0.5, shade(col,10)); cg.addColorStop(1, shade(col,-10));
        ctx.fillStyle=cg;
        ctx.beginPath(); ctx.moveTo(w/2-1,-h/2+2); ctx.lineTo(w/2+5,-h/2+6); ctx.lineTo(w/2+5,h/2-4); ctx.lineTo(w/2-1,h/2-2); ctx.closePath(); ctx.fill();
        // gloss stripe
        ctx.globalAlpha=0.45; ctx.fillStyle='#fff';
        ctx.fillRect(w/2, -h*0.2, 2.5, h*0.35);
      }
    }
    ctx.restore();
  }

  function drawKnife(x,y,ang){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(ang||0);
    // blade
    ctx.fillStyle='#d8dce2';
    ctx.beginPath(); ctx.moveTo(-6,-4); ctx.lineTo(38,0); ctx.lineTo(-6,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f4f6f8';
    ctx.beginPath(); ctx.moveTo(-6,-2); ctx.lineTo(34,0); ctx.lineTo(-6,1); ctx.closePath(); ctx.fill();
    // handle
    ctx.fillStyle='#5c3a28';
    roundRect(-22,-5,18,10,2); ctx.fill();
    ctx.fillStyle='#8b6914'; roundRect(-20,-3.5,6,7,1); ctx.fill();
    ctx.restore();
  }

  // ---------- Step drawers ----------
  function drawFishBlock(){
    const cx=W*0.38, cy=H*0.42;
    const fw=130, fh=78;
    const sq=1-fx.fishSquash*0.08;
    // cutting board right
    const bx=W*0.78, by=H*0.55;
    ctx.fillStyle='rgba(60,40,20,0.12)';
    roundRect(bx-55, by-70, 110, 150, 8); ctx.fill();
    roundRect(bx-58, by-75, 116, 155, 8);
    const bg=ctx.createLinearGradient(bx,by-75,bx,by+80);
    bg.addColorStop(0,'#f3e6d0'); bg.addColorStop(1,'#d9c4a0');
    ctx.fillStyle=bg; ctx.fill();
    ctx.strokeStyle='rgba(139,105,20,0.25)'; ctx.stroke();
    // wood grain on board
    ctx.strokeStyle='rgba(139,105,20,0.08)';
    for(let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(bx-50, by-60+i*18); ctx.lineTo(bx+50, by-55+i*18); ctx.stroke(); }

    // guide text
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('↓ 下滑选厚度 · 松手切开', cx, cy+fh/2+36);

    // fish block with squash
    const t=state.topping;
    ctx.save();
    ctx.translate(cx,cy); ctx.scale(1, sq);
    // shadow
    ctx.fillStyle='rgba(60,30,20,0.18)';
    roundRect(-fw/2+4, -fh/2+8, fw, fh, 12); ctx.fill();
    drawSashimiFlesh(0,0,fw,fh,0,t,{r:12, lines:7, cutFace: state.sliceCuts.length?'right':null});
    // previous cut marks
    state.sliceCuts.forEach(cut=>{
      const y=-fh/2+(cut.t||0.5)*fh;
      ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.lineWidth=2;
      ctx.beginPath();
      const x0=-fw/2+8, x1=fw/2-8;
      if(cut.jagged){ ctx.moveTo(x0,y); for(let x=x0;x<x1;x+=7) ctx.lineTo(x,y+Math.sin(x*0.8)*2.8); }
      else { ctx.moveTo(x0,y); ctx.lineTo(x1,y); }
      ctx.stroke();
    });
    // active knife guide line (red) while dragging
    if(state.dragging && state.step==='slice' && state.dragStart && !fx.slicing){
      const p=state.lastPointer;
      const localY=clamp((state.dragStart.y-cy)/fh+0.5,0.12,0.88);
      const yy=-fh/2+localY*fh;
      ctx.strokeStyle='rgba(220,60,50,0.85)'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(-fw/2+6,yy); ctx.lineTo(fw/2-6,yy); ctx.stroke(); ctx.setLineDash([]);
      // thickness preview label
      const dy=p? (p.y-state.dragStart.y):0;
      let lab='厚度预览';
      if(dy<50) lab='偏薄'; else if(dy>160) lab='偏厚'; else lab='刚好';
      ctx.fillStyle='rgba(220,60,50,0.9)'; ctx.font='bold 13px sans-serif';
      ctx.fillText(lab, 0, yy-10);
    }
    ctx.restore();

    // knife trail + knife
    if((state.dragging && state.step==='slice') || fx.slicing){
      const p=state.lastPointer||{x:cx,y:cy};
      let kx=p.x, ky=p.y;
      if(fx.slicing && fx.sliceAnim){
        const u=easeInOut(fx.slicePhase);
        const cut=fx.sliceAnim;
        kx=lerp(cx-fw/2-10, cx+fw/2+20, u);
        ky=cy-fh/2+cut.cutY*fh + Math.sin(u*Math.PI*6)* (cut.jagged?3.5:1.2);
        // trail
        fx.knifeTrail.push({x:kx,y:ky,life:1});
      } else if(state.lastPointer){
        kx=state.lastPointer.x + Math.sin(performance.now()/40)*1.2;
        ky=state.lastPointer.y;
        fx.knifeTrail.push({x:kx,y:ky,life:1});
      }
      // motion blur trail
      for(let i=0;i<fx.knifeTrail.length;i++){
        const tr=fx.knifeTrail[i];
        ctx.globalAlpha=tr.life*0.35;
        ctx.strokeStyle='#e8eef5'; ctx.lineWidth=2;
        if(i>0){ ctx.beginPath(); ctx.moveTo(fx.knifeTrail[i-1].x,fx.knifeTrail[i-1].y); ctx.lineTo(tr.x,tr.y); ctx.stroke(); }
      }
      ctx.globalAlpha=1;
      drawKnife(kx,ky, fx.slicing?0.15:-0.4);
    }

    // separated slice piece
    if(fx.separated){
      const s=fx.separated;
      const alpha=clamp(s.alpha,0,1);
      ctx.globalAlpha=alpha;
      // shadow on board
      ctx.fillStyle='rgba(40,30,20,0.2)';
      ctx.beginPath(); ctx.ellipse(s.x+4, s.y+s.h*0.45, s.w*0.45, 8, 0.2,0,Math.PI*2); ctx.fill();
      let sw=s.w, sh=s.h, sc=1;
      if(s.rating==='thin'){ sh*=0.55; ctx.globalAlpha=alpha*0.72; }
      if(s.rating==='thick'){ sh*=1.25; sw*=1.05; }
      drawSashimiFlesh(s.x,s.y,sw,sh,s.rot,t,{r:10, lines:s.rating==='thin'?3:6, cutFace:'left', bend:s.jagged?2:0});
      if(s.jagged){
        ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5;
        ctx.beginPath();
        for(let i=0;i<8;i++){
          const yy=s.y-sh/2+i*(sh/7);
          ctx.lineTo(s.x-sw/2+(i%2?3:-1), yy);
        }
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // cut flash / juice
    if(fx.cutFlash>0){
      ctx.fillStyle=`rgba(255,255,255,${fx.cutFlash*0.25})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  function drawHangiri(){
    const cx=W*0.42, cy=H*0.48;
    drawWaterBowl(W*0.78, H*0.22, true);
    // tub
    ctx.fillStyle='rgba(60,40,20,0.15)';
    ctx.beginPath(); ctx.ellipse(cx+4, cy+55, 105, 26,0,0,Math.PI*2); ctx.fill();
    // outer wood
    ctx.beginPath(); ctx.ellipse(cx, cy+40, 100, 28,0,0,Math.PI*2);
    ctx.fillStyle='#a67c52'; ctx.fill();
    // wall
    const wall=ctx.createLinearGradient(cx-100,cy,cx+100,cy);
    wall.addColorStop(0,'#b8956a'); wall.addColorStop(0.5,'#d4b896'); wall.addColorStop(1,'#a67c52');
    ctx.beginPath(); ctx.ellipse(cx, cy-5, 96, 52,0,0,Math.PI*2); ctx.fillStyle=wall; ctx.fill();
    // copper bands
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(cx, cy+18, 98, 24,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy+32, 100, 26,0,0,Math.PI*2); ctx.stroke();
    // interior rice bed
    if(!rice.bedCanvas) buildHangiriBed();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(cx, cy-8, 78, 36,0,0,Math.PI*2); ctx.clip();
    ctx.drawImage(rice.bedCanvas, cx-rice.bedW/2, cy-8-rice.bedH/2, rice.bedW, rice.bedH);
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(cx, cy-8, 78, 36,0,0,Math.PI*2);
    ctx.strokeStyle='rgba(120,90,50,0.35)'; ctx.lineWidth=2; ctx.stroke();

    // growing hand mound
    let amt=state.riceAmount;
    if(state.riceHolding) amt=Math.min(1,(performance.now()-state.riceHoldStart)/1800);
    syncMoundGrains(amt);
    // animate fly-in
    for(const g of rice.mound){
      if(g.fly>0){ g.fly=Math.max(0,g.fly-0.08); g.x=lerp(g.x,g.ox,0.18); g.y=lerp(g.y,g.oy,0.18); }
      else { g.x=g.ox; g.y=g.oy; }
    }
    if(amt>0.02){
      const sorted=rice.mound.slice().sort((a,b)=>a.y-b.y);
      ctx.fillStyle='rgba(40,30,20,0.12)';
      ctx.beginPath(); ctx.ellipse(cx, cy-18, 20+amt*30, 10+amt*8,0,0,Math.PI*2); ctx.fill();
      for(const g of sorted) drawGrainAt(g, cx, cy-20, 1, false);
      // faint hand under mound while holding
      if(state.riceHolding){
        drawHand(cx-28, cy-8, 0.55, -0.2, true);
        drawHand(cx+28, cy-8, 0.55, 0.2, false);
      }
    }
    ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText(state.wetHands?'按住木桶抓饭':'请先湿手！', cx, cy+90);
    if(state.stickyPenalty){ ctx.fillStyle='#c45c48'; ctx.fillText('手粘饭了…', cx, cy+108); }
  }

  function drawHand(x,y,scale,rot,left){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(left?-scale:scale, scale);
    // palm
    ctx.fillStyle='#f0c9a8';
    roundRect(-16,-10,32,28,12); ctx.fill();
    // fingers
    for(let i=0;i<4;i++){
      const fx0=-12+i*8;
      roundRect(fx0-4, -28, 7, 22, 3); ctx.fill();
    }
    // thumb
    ctx.beginPath(); ctx.ellipse(-18,2,7,5, -0.5,0,Math.PI*2); ctx.fill();
    // soft shade
    ctx.fillStyle='rgba(160,100,70,0.2)';
    roundRect(-12,0,24,12,6); ctx.fill();
    ctx.restore();
  }

  function drawShaping(){
    const cx=W/2, cy=H*0.48;
    drawMat(cx, cy+20, 210, 130);
    drawWaterBowl(W*0.82, H*0.16, false);

    if(!rice.pile.length) buildPileFromRice();
    // morph target from taps
    const taps=state.shapeTaps;
    let mt=0;
    if(taps<=0) mt=0;
    else if(taps<3) mt=0.15+taps*0.1;
    else if(taps<=6) mt=0.45+(taps-3)*0.08;
    else mt=0.85+(taps-6)*0.12;
    rice.morphTarget=mt;
    applyMorphToPile(rice.morph);
    drawGrainPile(cx, cy, rice.pile, 1);

    // press ripples
    for(const r of fx.pressRipples){
      ctx.strokeStyle=`rgba(255,255,255,${r.life*0.35})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(cx,cy,20+r.r,12+r.r*0.5,0,0,Math.PI*2); ctx.stroke();
    }

    // hands animation
    if(fx.hands.active || fx.hands.press>0.01){
      const p=fx.hands.press;
      const lift=lerp(50, 0, p);
      const spread=lerp(70, 38, p);
      drawHand(cx-spread, cy-8-lift, 0.85, -0.15+p*0.1, true);
      drawHand(cx+spread, cy-8-lift, 0.85, 0.15-p*0.1, false);
    } else if(state.step==='shape'){
      // idle hint hands above
      const bob=Math.sin(fx.idle*2)*4;
      ctx.globalAlpha=0.35;
      drawHand(cx-55, cy-40+bob, 0.55, -0.25, true);
      drawHand(cx+55, cy-40+bob, 0.55, 0.25, false);
      ctx.globalAlpha=1;
    }

    // wasabi
    if(state.wasabiAmount>0 && state.step!=='shape'){
      ctx.beginPath();
      ctx.ellipse(cx, cy-6, 5+state.wasabiAmount*12, 3+state.wasabiAmount*5, 0,0,Math.PI*2);
      const wg=ctx.createRadialGradient(cx-2,cy-8,1,cx,cy-6,14);
      wg.addColorStop(0,'#c5e86a'); wg.addColorStop(1,'#6a9b2a');
      ctx.fillStyle=wg; ctx.fill();
    }

    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    if(state.step==='shape'){
      const label=taps===0?'点击双手捏饭': taps<3?'还太松…': taps<=6?'紧实度不错': '要成石头了！';
      ctx.fillText(`${label}  ×${taps}`, cx, cy+95);
    } else {
      ctx.fillText('左右滑动抹芥末', cx, cy+95);
    }
  }

  function drawWasabi(){ drawShaping();
    if(state.dragging && state.lastPointer){
      ctx.font='22px serif'; ctx.fillText('🟢', state.lastPointer.x, state.lastPointer.y);
    }
  }

  function drawWrap(){
    const cx=W/2, cy=H*0.42;
    drawMat(cx, cy+40, 200, 120);
    if(!rice.pile.length) buildPileFromRice();
    rice.morphTarget=0.55; applyMorphToPile(rice.morph);
    drawGrainPile(cx, cy+10, rice.pile, 0.72);
    if(state.noriWrapped){
      roundRect(cx-38, cy-28, 76, 58, 5);
      ctx.fillStyle='#1a3a28'; ctx.fill();
      // grainy top
      const rng=mulberry32(9);
      for(let i=0;i<40;i++){
        const g=makeGrain(rng,(rng()-0.5)*40,(rng()-0.5)*14,0);
        drawGrainAt(g,cx,cy-6,0.85,false);
      }
    } else {
      roundRect(cx+70, cy-40, 50, 70, 3);
      ctx.fillStyle='#1a3a28'; ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText('点下方按钮包海苔', cx, cy+95);
    }
  }

  function drawToppingStep(){
    const cx=W/2, cy=H*0.45;
    drawMat(cx, cy+20, 220, 140);
    const t=state.topping;
    if(t.gunkan){
      roundRect(cx-38, cy-12, 76, 54, 5);
      ctx.fillStyle='#1a3a28'; ctx.fill();
      // rice inside
      const rng=mulberry32(21);
      for(let i=0;i<35;i++){
        const g=makeGrain(rng,(rng()-0.5)*36,(rng()-0.5)*10,0);
        drawGrainAt(g,cx,cy+6,0.8,false);
      }
      let amt=state.scoopAmount;
      if(amt>0){
        if(t.id==='ikura'||t.id==='tobiko'){
          for(let i=0;i<Math.floor(amt*18);i++){
            const a=i*1.7; const rr=4+(i%3);
            ctx.beginPath();
            ctx.arc(cx+Math.cos(a)*14*(0.3+amt), cy-8-amt*12+Math.sin(a)*8, rr,0,Math.PI*2);
            const rg=ctx.createRadialGradient(0,0,1,0,0,rr);
            ctx.fillStyle=shade(t.color,(i%2)*20); ctx.fill();
            ctx.fillStyle='rgba(255,255,255,0.35)';
            ctx.beginPath(); ctx.arc(cx+Math.cos(a)*14*(0.3+amt)-1.5, cy-8-amt*12+Math.sin(a)*8-1.5, rr*0.3,0,Math.PI*2); ctx.fill();
          }
        } else if(t.id==='uni'){
          drawSashimiFlesh(cx, cy-8-amt*10, 40, 16+amt*14, 0.1, t, {r:8, lines:3});
        } else {
          // negitoro
          ctx.beginPath(); ctx.ellipse(cx, cy-5-amt*12, 24, 8+amt*14,0,0,Math.PI*2);
          ctx.fillStyle=t.color; ctx.fill();
          ctx.fillStyle='#7cb342';
          for(let i=0;i<amt*8;i++){ ctx.fillRect(cx-15+i*5, cy-10-amt*10, 2, 6); }
        }
      }
      // spill particles
      for(const p of fx.spillParts){
        ctx.fillStyle=t.color; ctx.globalAlpha=p.life;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
      }
      if(state.spilled){ ctx.fillStyle='rgba(196,92,72,0.85)'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText('洒出来了…', cx, cy+88); }
      else { ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('按住舀入 · 松手完成', cx, cy+90); }
    } else {
      if(!rice.pile.length) buildPileFromRice();
      rice.morphTarget=0.55; applyMorphToPile(Math.max(rice.morph,0.5));
      drawGrainPile(cx, cy+12, rice.pile, 0.95);
      if(state.wasabiAmount>0){
        ctx.beginPath(); ctx.ellipse(cx, cy+2, 5+state.wasabiAmount*8, 3,0,0,Math.PI*2);
        ctx.fillStyle='#8bc34a'; ctx.fill();
      }
      const ax=state.toppingPlaced?(state.toppingAligned-0.5)*40:0;
      let tx=state.toppingPlaced?cx+ax:(state.dragging&&state.lastPointer?state.lastPointer.x:cx+80);
      let ty=state.toppingPlaced?cy-8:(state.dragging&&state.lastPointer?state.lastPointer.y:cy-55);
      // soft shadow height
      const lift=state.toppingPlaced?2:18;
      ctx.fillStyle=`rgba(30,40,60,${0.12+lift*0.008})`;
      ctx.beginPath(); ctx.ellipse(tx+2, cy+18, 40, 10,0,0,Math.PI*2); ctx.fill();
      const bend=state.draped? 1.5 : (state.drapeT||0)*1.5;
      const sc=state.draped?1:0.92;
      let ratingW=88, ratingH=34;
      drawSashimiFlesh(tx,ty,ratingW*sc,ratingH*sc,0,t,{r:12, lines:6, bend});
      if(!state.toppingPlaced){
        ctx.strokeStyle='rgba(100,220,140,0.7)'; ctx.setLineDash([5,4]); ctx.lineWidth=2;
        ctx.beginPath(); ctx.ellipse(cx, cy-5, 52, 28,0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(state.toppingPlaced?(state.draped?'贴合完成 · 去摆盘':'滑动一下贴合鱼片'):'拖到绿色框内', cx, cy+98);
    }
  }

  function drawPlate(){
    const cx=W/2, cy=H*0.48;
    ctx.fillStyle='rgba(60,40,20,0.15)';
    roundRect(cx-108, cy-36, 220, 95, 10); ctx.fill();
    roundRect(cx-110, cy-40, 220, 90, 8);
    const g=ctx.createLinearGradient(cx,cy-40,cx,cy+50);
    g.addColorStop(0,'#d4b896'); g.addColorStop(1,'#a67c52');
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(80,50,20,0.3)'; ctx.stroke();
    ctx.fillStyle='#8b6914';
    roundRect(cx-90, cy+48, 30, 14, 3); ctx.fill();
    roundRect(cx+60, cy+48, 30, 14, 3); ctx.fill();
    drawMiniNigiri(cx-20, cy, state.topping, 1);
    if(state.hasGari){ ctx.font='22px serif'; ctx.fillText('🫚', cx+55, cy+5); }
    state.pieces.slice(-2).forEach((p,i)=>drawMiniNigiri(cx-70+i*25, cy+22, p.topping, 0.55));
  }

  function drawMiniNigiri(x,y,t,alpha){
    ctx.save(); ctx.globalAlpha=alpha==null?1:alpha;
    if(t.gunkan){
      roundRect(x-18,y-12,36,28,3); ctx.fillStyle='#1a3a28'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(x,y-8,14,8,0,0,Math.PI*2); ctx.fillStyle=t.color; ctx.fill();
    } else {
      // mini grains
      const rng=mulberry32(x*10+(t.id?t.id.length:1));
      for(let i=0;i<22;i++){
        const g=makeGrain(rng,(rng()-0.5)*28,(rng()*8)-6,0);
        drawGrainAt(g,x,y+8,0.7,false);
      }
      drawSashimiFlesh(x,y-4,40,16,0,t,{r:7, lines:4});
    }
    ctx.restore();
  }

  function draw(){
    if(state.screen!=='play') return;
    ctx.save();
    if(fx.screenPulse>0){
      const s=1+fx.screenPulse*0.015;
      ctx.translate(W/2,H/2); ctx.scale(s,s); ctx.translate(-W/2,-H/2);
    }
    drawWoodBg();
    ctx.globalAlpha=fx.fade;
    switch(state.step){
      case 'slice': drawFishBlock(); break;
      case 'wet': case 'rice': drawHangiri(); break;
      case 'shape': drawShaping(); break;
      case 'wasabi': drawWasabi(); break;
      case 'wrap': drawWrap(); break;
      case 'topping': drawToppingStep(); break;
      case 'plate': drawPlate(); break;
    }
    // sparkles overlay
    for(const s of fx.sparkles){
      ctx.globalAlpha=s.life; ctx.fillStyle=s.col;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.sz*s.life,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // ---------- Animation loop ----------
  let lastTs=performance.now();
  function needAnim(){ if(!animRunning){ animRunning=true; requestAnimationFrame(tick); } }
  function tick(ts){
    const dt=Math.min(0.05,(ts-lastTs)/1000); lastTs=ts;
    fx.idle+=dt;
    let alive=false;

    // fade
    if(fx.fade<1){ fx.fade=Math.min(1,fx.fade+dt*3); alive=true; }

    // knife trail decay
    for(const tr of fx.knifeTrail){ tr.life-=dt*3; alive=true; }
    fx.knifeTrail=fx.knifeTrail.filter(t=>t.life>0);
    if(fx.knifeTrail.length>40) fx.knifeTrail.splice(0, fx.knifeTrail.length-40);

    // sparkles
    for(const s of fx.sparkles){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.12; s.life-=dt*1.8; alive=true; }
    fx.sparkles=fx.sparkles.filter(s=>s.life>0);

    // water ripples
    for(const r of fx.waterRipples){ r.r+=dt*40; r.life-=dt*1.2; alive=true; }
    fx.waterRipples=fx.waterRipples.filter(r=>r.life>0);

    // press ripples
    for(const r of fx.pressRipples){ r.r+=dt*50; r.life-=dt*1.5; alive=true; }
    fx.pressRipples=fx.pressRipples.filter(r=>r.life>0);

    // fish squash decay
    if(fx.fishSquash>0){ fx.fishSquash=Math.max(0,fx.fishSquash-dt*2.5); alive=true; }
    if(fx.cutFlash>0){ fx.cutFlash=Math.max(0,fx.cutFlash-dt*2); alive=true; }
    if(fx.screenPulse>0){ fx.screenPulse=Math.max(0,fx.screenPulse-dt*2.2); alive=true; }

    // slice animation
    if(fx.slicing && fx.sliceAnim){
      alive=true;
      const a=fx.sliceAnim;
      fx.slicePhase=clamp((performance.now()-a.start)/a.dur,0,1);
      fx.fishSquash=Math.sin(fx.slicePhase*Math.PI)*1.2;
      if(fx.slicePhase>=1){
        fx.slicing=false;
        // spawn separated piece
        const rating=a.rating;
        let w=70,h=28;
        if(rating==='thin'){ w=68; h=16; }
        if(rating==='thick'){ w=78; h=40; }
        fx.separated={
          x:W*0.38+20, y:H*0.42, vx:2.2, vy:-1.5, rot:-0.15, vr:0.02,
          w,h, alpha:1, life:0, rating, jagged:a.jagged
        };
        fx.cutFlash=1;
        spawnSparkles(W*0.45, H*0.42, 14, shade(state.topping.color,40));
        if(rating==='ok' && !a.jagged) fx.screenPulse=1;
        floatFeedback(({thin:'太薄',ok:'刚好',thick:'太厚'})[rating]+(a.jagged?' · 切口毛糙':''), rating==='ok'?'good':'bad');
      }
    }

    // separated physics
    if(fx.separated){
      alive=true;
      const s=fx.separated; s.life+=dt;
      if(s.life<0.9){
        s.vy+=18*dt; s.x+=s.vx; s.y+=s.vy; s.rot+=s.vr;
        // land on board
        const landY=H*0.55;
        if(s.y>landY){ s.y=landY; s.vy*=-0.25; s.vx*=0.7; s.vr*=0.5; }
        s.x=lerp(s.x, W*0.78, dt*1.2);
      } else {
        s.x=lerp(s.x, W*0.78, 0.1);
        s.y=lerp(s.y, H*0.55, 0.1);
        s.rot=lerp(s.rot, 0.25, 0.08);
      }
    }

    // hands press
    if(fx.hands.active){
      alive=true;
      fx.hands.t+=dt;
      if(fx.hands.t<0.18) fx.hands.press=easeOutCubic(fx.hands.t/0.18);
      else if(fx.hands.t<0.45) fx.hands.press=1;
      else if(fx.hands.t<0.7) fx.hands.press=1-easeOutCubic((fx.hands.t-0.45)/0.25);
      else { fx.hands.active=false; fx.hands.press=0; }
    }

    // pile springs
    if(rice.pile.length && (state.step==='shape'||state.step==='wasabi'||state.step==='topping'||state.step==='wrap')){
      const before=rice.morph;
      stepPileSprings(dt);
      if(Math.abs(rice.morph-rice.morphTarget)>0.002) alive=true;
      else if(rice.pile.some(g=>Math.abs(g.x-g.tx)+Math.abs(g.y-g.ty)>0.05)) alive=true;
    }

    // rice holding
    if(state.riceHolding){ alive=true; state.riceAmount=Math.min(1,(performance.now()-state.riceHoldStart)/1800); }

    // scoop
    if(state._scooping){
      alive=true;
      state.scoopAmount=Math.min(1.2, state.scoopAmount+dt*0.55);
      if(state.scoopAmount>1){
        state.spilled=true;
        if(Math.random()<0.3){
          fx.spillParts.push({x:W/2+(Math.random()-0.5)*40, y:H*0.4, vx:(Math.random()-0.5)*2, vy:-1, r:3+Math.random()*3, life:1});
        }
      }
    }
    for(const p of fx.spillParts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life-=dt*0.8; alive=true; }
    fx.spillParts=fx.spillParts.filter(p=>p.life>0);

    // flying sticky grains
    for(const g of fx.flyingGrains){ g.x+=g.vx; g.y+=g.vy; g.vy+=0.2; g.life-=dt; alive=true; }
    fx.flyingGrains=fx.flyingGrains.filter(g=>g.life>0);

    // idle bob on shape
    if(state.step==='shape'||state.step==='slice'||state.step==='rice') alive=true;

    draw();
    // draw flying grains overlay
    for(const g of fx.flyingGrains){
      ctx.save(); ctx.globalAlpha=g.life; ctx.translate(g.x,g.y); ctx.rotate(g.rot);
      ctx.fillStyle=g.col; ctx.beginPath(); ctx.ellipse(0,0,g.len/2,g.wid/2,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    if(alive || state.dragging) requestAnimationFrame(tick);
    else animRunning=false;
  }

  // ---------- Game flow (preserved) ----------
  function updateCollectedHint(){ $('#collected-count').textContent=`已收集称号 ${collectedTitles.length} / ${ALL_TITLES.length}`; }

  function renderToppingGrid(){
    const grid=$('#topping-grid'); grid.innerHTML='';
    TOPPINGS.forEach(t=>{
      const card=document.createElement('div'); card.className='topping-card';
      card.innerHTML=`<div class="emoji">${t.emoji}</div><div class="name">${t.name}</div>${t.gunkan?'<span class="tag">军舰</span>':''}`;
      card.addEventListener('click',()=>startPiece(t));
      grid.appendChild(card);
    });
  }

  function resetPieceState(){
    Object.assign(state,{
      step: state.topping&&state.topping.gunkan?'wet':'slice',
      wetHands:false, sliceCuts:[], sliceRating:null, sliceJagged:false,
      riceAmount:0, riceHolding:false, riceRating:null, stickyPenalty:false,
      shapeTaps:0, firmness:null, wasabiAmount:0, wasabiStrokes:0,
      noriWrapped:false, scoopAmount:0, spilled:false,
      toppingPlaced:false, toppingAligned:0.5, draped:false, drapeT:0, hasGari:false,
      dragging:false, dragStart:null, _scooping:false,
    });
    rice.mound=[]; rice.pile=[]; rice.morph=0; rice.morphTarget=0;
    fx.separated=null; fx.slicing=false; fx.knifeTrail=[]; fx.hands.active=false; fx.hands.press=0;
    fx.spillParts=[]; fx.sparkles=[]; fx.fade=0.35;
  }

  function startPiece(topping){
    state.topping=topping; resetPieceState();
    state.step=topping.gunkan?'wet':'slice';
    updateHUD(); renderBoardBar(); renderControls(); updateHint(); showScreen('play');
  }

  function updateHUD(){
    $('#hud-piece').textContent=`第 ${state.pieceIndex+1} 贯`;
    $('#hud-topping').textContent=state.topping?state.topping.emoji+' '+state.topping.name:'';
    $('#hud-step').textContent=STEPS[state.step]||state.step;
    $('#btn-finish-early').style.display=state.pieces.length>0?'block':'none';
  }

  function renderBoardBar(){
    const bar=$('#board-bar'); bar.innerHTML='';
    const slots=Math.max(3, state.pieces.length+1);
    for(let i=0;i<slots;i++){
      const d=document.createElement('div');
      if(i<state.pieces.length){ d.className='board-piece'; d.textContent=state.pieces[i].emoji; d.title=state.pieces[i].topping.name; }
      else if(i===state.pieces.length && state.topping){ d.className='board-piece'; d.style.opacity='0.5'; d.textContent='…'; }
      else { d.className='board-piece empty'; d.textContent='＋'; }
      bar.appendChild(d);
    }
  }

  function updateHint(){
    const hints={
      slice:'向下滑动切鱼片 · 松手完成一切 · 锯切会毛糙',
      wet:'先点「湿手」，再去抓饭',
      rice:'按住木桶抓饭 · 按越久饭越多 · 军舰饭量要少一点',
      shape:'点击饭团捏紧 · 双手会压下去 · 捏几下就好',
      wasabi:'在饭上左右滑动抹芥末 · 可跳过',
      wrap:'点击包上海苔',
      topping: state.topping&&state.topping.gunkan?'按住舀入食材 · 太多会洒出来':'把食材拖到饭上 · 再轻轻滑动贴合',
      plate:'点击摆上木盘 · 可加点姜片装饰',
    };
    $('#stage-hint').textContent=hints[state.step]||'';
    $('#stage-tip').textContent=STEP_TIPS[state.step]||'';
  }

  function renderControls(){
    const c=$('#controls'); c.innerHTML='';
    const add=(label,cls,fn)=>{ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=label; b.addEventListener('click',fn); c.appendChild(b); return b; };
    if(state.step==='wet'||(state.step==='rice'&&!state.wetHands)){
      add(state.wetHands?'✓ 已湿手':'💧 湿手','btn-wet'+(state.wetHands?' active':''),()=>{
        state.wetHands=true;
        fx.waterRipples.push({r:0,life:1},{r:4,life:0.8});
        spawnSparkles(W*0.78,H*0.22,8,'#c8e8f8');
        if(state.step==='wet'){ state.step='rice'; updateHUD(); updateHint(); }
        renderControls(); floatFeedback('手润润的～','good'); needAnim();
      });
    }
    if(state.step==='wasabi'){
      add('跳过芥末','btn-secondary',()=>{ state.wasabiAmount=0; goAfterWasabi(); });
    }
    if(state.step==='wrap'){
      add('🌿 包海苔','btn-action',()=>{
        state.noriWrapped=true; state.step='topping'; updateHUD(); updateHint(); renderControls();
        floatFeedback('海苔包好了','good'); fx.fade=0.4; needAnim();
      });
    }
    if(state.step==='plate'){
      if(!state.hasGari) add('🫚 加点姜','btn-secondary',()=>{ state.hasGari=true; floatFeedback('姜片点缀','good'); toast('📚 姜片用来清口，换下一块鱼时吃'); renderControls(); needAnim(); });
      add('✓ 完成这贯','btn-primary', finishPiece);
    }
    if(state.step==='shape'){
      add('下一步 · 芥末','btn-action',()=>{ rateFirmness(); state.step='wasabi'; updateHUD(); updateHint(); renderControls(); fx.fade=0.4; needAnim(); });
    }
    if(state.step==='topping' && !state.topping.gunkan && state.toppingPlaced){
      add(state.draped?'去摆盘 →':'跳过贴合 · 摆盘','btn-action',()=>{
        state.step='plate'; updateHUD(); updateHint(); renderControls(); fx.fade=0.4; needAnim();
      });
    }
  }

  function goAfterWasabi(){
    state.step=state.topping.gunkan?'wrap':'topping';
    updateHUD(); updateHint(); renderControls(); fx.fade=0.4; needAnim();
  }

  function rateSlice(){
    if(!state.sliceCuts.length){ state.sliceRating='thick'; return; }
    const cut=state.sliceCuts[state.sliceCuts.length-1];
    const len=Math.abs(cut.dy||80);
    state.sliceJagged=state.sliceCuts.length>1||cut.jagged;
    if(len<50) state.sliceRating='thin';
    else if(len>160) state.sliceRating='thick';
    else state.sliceRating='ok';
  }
  function rateRice(){
    const ideal=state.topping.gunkan?0.35:0.55;
    if(state.riceAmount<ideal-0.18) state.riceRating='little';
    else if(state.riceAmount>ideal+0.22) state.riceRating='much';
    else state.riceRating='ok';
  }
  function rateFirmness(){
    if(state.shapeTaps<2) state.firmness='loose';
    else if(state.shapeTaps>8) state.firmness='hard';
    else state.firmness='ok';
    const map={loose:'还太松',ok:'紧实度刚好',hard:'捏得太硬'};
    floatFeedback(map[state.firmness], state.firmness==='ok'?'good':state.firmness==='loose'?'ok':'bad');
  }

  function scorePiece(){
    let cut=70, riceS=70, firm=70, wasabi=80, align=70, plate=70;
    if(state.topping.gunkan) cut=85;
    else {
      if(state.sliceRating==='ok') cut=state.sliceJagged?72:95;
      else if(state.sliceRating==='thin') cut=55; else cut=45;
    }
    if(state.riceRating==='ok') riceS=92; else if(state.riceRating==='little') riceS=50; else riceS=48;
    if(state.stickyPenalty) riceS=Math.max(20, riceS-25);
    if(state.firmness==='ok') firm=90; else if(state.firmness==='loose') firm=55; else firm=40;
    if(state.wasabiAmount===0) wasabi=75; else if(state.wasabiAmount<0.35) wasabi=95; else if(state.wasabiAmount<0.7) wasabi=70; else wasabi=35;
    if(state.topping.gunkan) align=state.spilled?35:(state.scoopAmount>0.2&&state.scoopAmount<0.85?90:55);
    else { align=40+state.toppingAligned*55; if(state.draped) align=Math.min(100,align+10); }
    plate=state.hasGari?88:72; if(state.pieces.length>=2) plate+=5;
    const total=Math.round(cut*0.2+riceS*0.22+firm*0.18+wasabi*0.12+align*0.18+plate*0.1);
    return {cut, rice:riceS, firm, wasabi, align, plate, total:Math.max(0,Math.min(100,total))};
  }

  function pickQuirk(scores, pieceStates){
    const quirks=[]; const all=pieceStates; const avg=scores.avg; const last=all[all.length-1];
    if(last){
      if(last.wasabiAmount>0.7) quirks.push('芥末放太多');
      if(last.firmness==='hard') quirks.push('捏得像石头');
      if(last.sliceRating==='thick') quirks.push('切太厚');
      if(last.sliceRating==='thin') quirks.push('切太薄像纸片');
      if(last.riceRating==='much') quirks.push('米饭太多撑爆了');
      if(last.riceRating==='little') quirks.push('米饭太少空空的');
      if(last.stickyPenalty) quirks.push('手还粘着饭');
      if(last.spilled) quirks.push('军舰翻船了');
      if(last.hasGari&&last.scores.total>=85) quirks.push('生姜刺客');
    }
    if(avg>=92&&quirks.length===0) return '传说级握寿司';
    if(avg>=85&&quirks.length===0) return '入口即化';
    if(avg>=80&&quirks.length===0) return '刚刚好的匠人';
    if(avg>=75&&all.every(p=>p.hasGari)) return '摆盘艺术家';
    if(quirks.length===0&&avg>=70) return '没有特别的怪癖放到最满';
    if(quirks.length===0) return '随缘厨师';
    return quirks[0];
  }

  function finishPiece(){
    if(state.step!=='plate'){
      if(!state.sliceRating&&!state.topping.gunkan) rateSlice();
      if(!state.riceRating) rateRice();
      if(!state.firmness) rateFirmness();
    }
    const scores=scorePiece();
    state.pieces.push({
      topping:state.topping, emoji:state.topping.emoji, scores,
      sliceRating:state.sliceRating, riceRating:state.riceRating, firmness:state.firmness,
      wasabiAmount:state.wasabiAmount, stickyPenalty:state.stickyPenalty, spilled:state.spilled,
      hasGari:state.hasGari, toppingAligned:state.toppingAligned,
    });
    state.pieceIndex=state.pieces.length;
    if(state.pieces.length>=3) showResult();
    else { toast(`第 ${state.pieces.length} 贯完成！再选食材继续～`); showScreen('pick'); }
  }

  function showResult(){
    const avg=Math.round(state.pieces.reduce((s,p)=>s+p.scores.total,0)/state.pieces.length);
    const quirk=pickQuirk({avg}, state.pieces);
    const isNew=saveTitle(quirk); updateCollectedHint();
    $('#score-big').textContent=avg; $('#quirk-title').textContent=quirk;
    const bd=$('#score-breakdown');
    bd.innerHTML=state.pieces.map((p,i)=>`<div class="row"><span>${i+1}. ${p.topping.name}</span><span>${p.scores.total} 分</span></div>`).join('')+`<div class="row"><span><b>平均</b></span><span><b>${avg}</b></span></div>`;
    const last=state.pieces[state.pieces.length-1].scores;
    bd.innerHTML+=`<div class="row" style="margin-top:8px;color:#7a6550"><span>切工</span><span>${last.cut}</span></div>
      <div class="row" style="color:#7a6550"><span>饭量</span><span>${last.rice}</span></div>
      <div class="row" style="color:#7a6550"><span>紧实度</span><span>${last.firm}</span></div>
      <div class="row" style="color:#7a6550"><span>芥末</span><span>${last.wasabi}</span></div>
      <div class="row" style="color:#7a6550"><span>贴合</span><span>${last.align}</span></div>
      <div class="row" style="color:#7a6550"><span>摆盘</span><span>${last.plate}</span></div>`;
    const box=$('#titles-box');
    box.innerHTML='<div style="margin-bottom:6px;font-weight:700">称号收藏</div>'+collectedTitles.map(t=>`<span class="chip${t===quirk&&isNew?' new':''}">${t}${t===quirk&&isNew?' ✨新':''}</span>`).join('');
    showScreen('result');
  }

  // ---------- Pointer ----------
  function ptr(e){
    const r=canvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]||e.changedTouches[0]:e;
    return {x:((src.clientX-r.left)/r.width)*W, y:((src.clientY-r.top)/r.height)*H};
  }

  function startSliceAnim(cut){
    fx.slicing=true;
    fx.slicePhase=0;
    fx.sliceAnim={ start:performance.now(), dur: cut.jagged?900:720, cutY:cut.t, jagged:cut.jagged, rating:state.sliceRating, dy:cut.dy };
    needAnim();
    // advance after drama
    setTimeout(()=>{
      state.step='wet'; updateHUD(); updateHint(); renderControls(); fx.fade=0.35; needAnim();
    }, (cut.jagged?900:720)+850);
  }

  function onDown(e){
    if(state.screen!=='play') return;
    e.preventDefault();
    if(fx.slicing) return;
    const p=ptr(e);
    state.dragging=true; state.dragStart=p; state.lastPointer=p;
    canvas.classList.add('grabbing');

    if(state.step==='rice'){
      if(!state.wetHands){ state.stickyPenalty=true; floatFeedback('忘了湿手！粘住了','bad'); toast('先点「湿手」再抓饭'); }
      state.riceHolding=true;
      state.riceHoldStart=performance.now()-state.riceAmount*1800;
      needAnim();
    }
    if(state.step==='shape'){
      state.shapeTaps++;
      fx.hands.active=true; fx.hands.t=0; fx.hands.press=0;
      fx.pressRipples.push({r:0,life:1});
      // morph bump
      const taps=state.shapeTaps;
      let mt=taps<3?0.15+taps*0.1: taps<=6?0.45+(taps-3)*0.08: 0.85+(taps-6)*0.12;
      rice.morphTarget=mt;
      if(!rice.pile.length) buildPileFromRice();
      applyMorphToPile(rice.morph);
      const msgs=['捏~','再捏','紧一点','好','扎实','完美？','小心','石头？'];
      floatFeedback(msgs[Math.min(msgs.length-1,taps-1)], taps<=6?'ok':'bad');
      if(taps===4) spawnSparkles(W/2,H*0.48,10,'#fff8e0');
      needAnim();
    }
    if(state.step==='topping'&&state.topping.gunkan){ state._scooping=true; needAnim(); }
    needAnim();
  }

  function onMove(e){
    if(!state.dragging) return;
    e.preventDefault();
    const p=ptr(e); state.lastPointer=p;
    if(state.step==='wasabi'){
      const dx=Math.abs(p.x-(state.dragStart?state.dragStart.x:p.x));
      if(dx>8){ state.wasabiAmount=Math.min(1.2,state.wasabiAmount+0.02); state.wasabiStrokes++; state.dragStart=p; }
    }
    if(state.step==='topping'&&!state.topping.gunkan&&state.toppingPlaced&&!state.draped){
      const dy=Math.abs(p.y-state.dragStart.y), dx=Math.abs(p.x-state.dragStart.x);
      state.drapeT=clamp((dx+dy)/80,0,1);
      if(dx+dy>40){ state.draped=true; floatFeedback('贴合完美','good'); spawnSparkles(W/2,H*0.42,12,shade(state.topping.color,30)); renderControls(); }
    }
    needAnim();
  }

  function onUp(e){
    if(!state.dragging&&!state.riceHolding&&!state._scooping) return;
    e.preventDefault();
    const p=state.lastPointer||ptr(e);
    canvas.classList.remove('grabbing');

    if(state.step==='slice'&&state.dragStart&&!fx.slicing){
      const dy=p.y-state.dragStart.y;
      const dx=Math.abs(p.x-state.dragStart.x);
      if(dy>30){
        const jagged=dx>40||state.sliceCuts.length>0;
        const cut={ t:clamp((state.dragStart.y-H*0.42+39)/78,0.15,0.85), dy, jagged };
        state.sliceCuts.push(cut);
        rateSlice();
        startSliceAnim(cut);
      }
    }

    if(state.step==='rice'&&state.riceHolding){
      state.riceHolding=false;
      state.riceAmount=Math.min(1,(performance.now()-state.riceHoldStart)/1800);
      rateRice();
      const map={little:'太少了',ok:'分量刚好',much:'太多了'};
      floatFeedback(map[state.riceRating], state.riceRating==='ok'?'good':'bad');
      setTimeout(()=>{
        state.step='shape'; buildPileFromRice(); updateHUD(); updateHint(); renderControls(); fx.fade=0.35; needAnim();
      },450);
    }

    if(state.step==='wasabi'){
      if(state.wasabiAmount>0.75) floatFeedback('芥末有点多…','bad');
      else if(state.wasabiAmount>0) floatFeedback('芥末适量','good');
      setTimeout(()=>goAfterWasabi(),400);
    }

    if(state.step==='topping'&&!state.topping.gunkan){
      if(!state.toppingPlaced){
        const cx=W/2, cy=H*0.45;
        const dist=Math.hypot(p.x-cx,p.y-(cy-5));
        if(dist<70){ state.toppingPlaced=true; state.toppingAligned=clamp(0.5+(p.x-cx)/80,0,1); floatFeedback('放上去了','good'); renderControls(); }
        else floatFeedback('再靠近一点','ok');
      } else if(state.draped){
        state.step='plate'; updateHUD(); updateHint(); renderControls(); fx.fade=0.35; needAnim();
      }
    }

    if(state.step==='topping'&&state.topping.gunkan&&state._scooping){
      state._scooping=false;
      if(state.scoopAmount>0.95){ state.spilled=true; floatFeedback('洒出来了！','bad'); }
      else if(state.scoopAmount<0.2) floatFeedback('太少了','ok');
      else floatFeedback('装满了','good');
      state.toppingPlaced=true;
      setTimeout(()=>{ state.step='plate'; updateHUD(); updateHint(); renderControls(); fx.fade=0.35; needAnim(); },500);
    }

    state.dragging=false; state.dragStart=null; needAnim();
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp, {passive:false});
  canvas.addEventListener('touchcancel', onUp, {passive:false});

  $('#btn-start').addEventListener('click',()=>{ state.pieces=[]; state.pieceIndex=0; renderToppingGrid(); showScreen('pick'); });
  $('#btn-howto').addEventListener('click',()=>{ toast('选食材 → 切鱼 → 湿手抓饭 → 捏饭 → 芥末 → 放食材 → 摆盘。捏满3贯评分！每步下方有小知识～'); });
  $('#btn-again').addEventListener('click',()=>{ state.pieces=[]; state.pieceIndex=0; renderToppingGrid(); showScreen('pick'); });
  $('#btn-home').addEventListener('click',()=>{ updateCollectedHint(); showScreen('start'); });
  $('#btn-finish-early').addEventListener('click',()=>{
    if(state.pieces.length===0){ toast('至少完成 1 贯再收工哦'); return; }
    showResult();
  });
  window.addEventListener('resize',()=>{ if(state.screen==='play') resize(); });

  updateCollectedHint(); renderToppingGrid();
})();
</script>
</body>
</html>
